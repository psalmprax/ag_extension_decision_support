apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: gpexts
spec:
  replicas: 2
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      containers:
        - name: backend
          image: ghcr.io/org/ag-extension-backend:latest
          ports: [{ containerPort: 3001 }]
          envFrom: [{ secretRef: { name: backend-env } }]
          readinessProbe:
            httpGet: { path: /health/live, port: 3001 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 3001 }
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: gpexts
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: ghcr.io/org/ag-extension-frontend:latest
          ports: [{ containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: gpexts
spec:
  selector: { app: backend }
  ports: [{ port: 80, targetPort: 3001 }]
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: gpexts
spec:
  selector: { app: frontend }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gpexts
  namespace: gpexts
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["www.gpexts.com"]
      secretName: gpexts-tls
  rules:
    - host: www.gpexts.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: backend, port: { number: 80 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: frontend, port: { number: 80 } } }
