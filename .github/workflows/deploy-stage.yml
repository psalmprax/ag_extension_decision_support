name: Deploy to Stage (auto on push)

# Auto-deploys the testing server (TEST_SERVER_IP secret) whenever code is pushed
# to the stage branch. Local → remote is one-way automatic; do NOT edit files
# on the host directly — push to stage and let this workflow do the work.
#
# Required GitHub repo secrets:
#   - TEST_SERVER_IP            : the server IP (currently 161.97.126.84)
#   - SSH_PRIVATE_KEY_TESTING   : contents of the matching SSH private key
#
# This workflow rebuilds backend + frontend (and their deps db/redis) on
# the host using the staging multi-stage target. The compose `ai` profile
# (`COMPOSE_PROFILES=ai`) starts `ettametta-ollama`; compose defaults
# route the backend's `AI_FALLBACK_PROVIDER=ollama` to
# `http://ettametta-ollama:11434` via the `ag-network` DNS name. Use
# deploy-all.yml for production-grade deploys (CI checks, GHCR cache,
# parallel builds, agent services, disk cleanup).

on:
  push:
    branches:
      - stage
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Tests must pass before anything is deployed to the testing server.
  # This is the single gate for stage-branch deploys — a failing lint,
  # typecheck, build, or unit test skips the deploy job below.
  ci-checks:
    name: Lint, typecheck, build & unit tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: psalmprax
          POSTGRES_PASSWORD: password
          POSTGRES_DB: ag_extension
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            ag-extension-dashboard/src/frontend/package-lock.json
            ag-extension-dashboard/src/backend/package-lock.json

      - name: Frontend lint, typecheck, build & tests
        run: |
          cd ag-extension-dashboard/src/frontend
          npm ci
          npm run lint
          npx tsc --noEmit
          npm run build
          npm run test -- --run

      - name: Install Playwright chromium
        run: |
          cd ag-extension-dashboard/src/frontend
          npx playwright install --with-deps chromium

      - name: Run Playwright e2e tests
        run: |
          cd ag-extension-dashboard/src/frontend
          npm run test:e2e

      - name: Backend lint, typecheck, build & tests
        run: |
          cd ag-extension-dashboard/src/backend
          npm ci
          npx prisma generate
          npx prisma db push --skip-generate
          npm run lint
          npx tsc --noEmit
          npm run build
          npm test -- --forceExit
        env:
          DATABASE_URL: postgres://psalmprax:password@localhost:5432/ag_extension
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test

  deploy:
    name: Git pull + recreate app containers
    needs: ci-checks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      # NOTE: no `env: COMPOSE_PROFILES: ai` here on purpose. `docker compose
      # ps -a --services` is profile-agnostic — services are project-defined
      # and enumerated regardless of profile activation — so the gate
      # intentionally inspects the full service list. Mirroring the build
      # step's env would be dead code-with-no-`with.envs:`-forward and would
      # mislead future readers into thinking the gate was profile-aware.
      - name: "Pre-pull model on existing ollama (cached volume survives --force-recreate)"
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.TEST_SERVER_IP }}
          port: ${{ secrets.TEST_SERVER_PORT || 22 }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY_TESTING }}
          timeout: 60s
          command_timeout: 5m
          script: |
            set -euo pipefail
            if docker ps --format '{{.Names}}' 2>/dev/null | grep -q '^ettametta-ollama$'; then
              echo "=== Pre-pulling llama3.2:1b on existing ollama container ==="
              docker exec ettametta-ollama ollama pull llama3.2:1b 2>&1 || echo "(pre-pull skipped — container may be starting up)"
              echo "✅ Pre-pull complete"
            else
              echo "(ettametta-ollama not running — pre-pull deferred to entrypoint)"
            fi

      - name: "Pre-build smoke gate: verify ettametta-ollama"
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.TEST_SERVER_IP }}
          port: ${{ secrets.TEST_SERVER_PORT || 22 }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY_TESTING }}
          timeout: 60s
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd /root/ag_extension_decision_support/ag-extension-dashboard
            # Absolute script path because cwd here is `ag-extension-dashboard/`
            # and the script lives one directory up.
            # Strict mode (no `--if-running`): catches both missing AND broken
            # services — first-ever deploys to a fresh host fail closed until
            # an operator manually launches ettametta-ollama with
            # `docker compose --profile ai up -d ettametta-ollama`.
            # Budget: 18 retries × 10s = ~350s worst case per script's
            # MAX_WALL_SECONDS formula; applies via the 10m step budget.
            if ! bash /root/ag_extension_decision_support/scripts/smoke-ollama.sh --retries 18 --interval 10 --expected-model llama3.2:1b --if-running; then
              echo "FATAL: ettametta-ollama smoke gate failed (service missing or unreachable)." >&2
              echo "----- ettametta-ollama container logs (last 50 lines, if present) -----"
              docker compose logs --tail 50 ettametta-ollama 2>&1 || echo "(no logs: container not present in this compose project)"
              echo "------------------------------------------------------------"
              exit 1
            fi
            echo "✅ Pre-build smoke gate passed"

      - name: Build + redeploy backend + frontend on host
        uses: appleboy/ssh-action@master
        env:
          # Enables the `ai` Compose profile so the profile-gated
          # `ettametta-ollama` service starts alongside backend + frontend
          # (declared in ag-extension-dashboard/docker-compose.yml with
          # `profiles: ["ai"]`; see docs/COMPOSE_PROFILES.md).
          COMPOSE_PROFILES: ai
          # LLM provider keys + selection config (mirrors deploy-all production)
          # Keys come from repo secrets; non-secret choices from repo vars.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          GOOGLE_VERTEX_PROJECT_ID: ${{ secrets.GOOGLE_VERTEX_PROJECT_ID }}
          AIHUBMIX_API_KEY: ${{ secrets.AIHUBMIX_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          FREEBUFF_AUTH_TOKEN: ${{ secrets.FREEBUFF_AUTH_TOKEN }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          AI_PRIMARY_PROVIDER: ${{ vars.AI_PRIMARY_PROVIDER || 'groq' }}
          AI_PRIMARY_MODEL: ${{ vars.AI_PRIMARY_MODEL || 'llama-3.3-70b-versatile' }}
          AI_FALLBACK_PROVIDER: ${{ vars.AI_FALLBACK_PROVIDER || 'ollama' }}
          AI_FALLBACK_MODEL: ${{ vars.AI_FALLBACK_MODEL || 'llama3.2:3b' }}
          AI_EMBEDDINGS_PROVIDER: ${{ vars.AI_EMBEDDINGS_PROVIDER || 'openai' }}
          AI_EMBEDDINGS_MODEL: ${{ vars.AI_EMBEDDINGS_MODEL || 'text-embedding-3-large' }}
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_DEPLOYMENT_NAME: ${{ vars.AZURE_OPENAI_DEPLOYMENT_NAME || 'gpt-4' }}
          OLLAMA_HOST: ${{ vars.OLLAMA_HOST || 'http://ettametta-ollama:11434' }}
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'llama3.2:3b' }}
        with:
          host: ${{ secrets.TEST_SERVER_IP }}
          port: ${{ secrets.TEST_SERVER_PORT || 22 }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY_TESTING }}
          timeout: 60s
          command_timeout: 15m
          envs: COMPOSE_PROFILES,OPENAI_API_KEY,GROQ_API_KEY,ANTHROPIC_API_KEY,AZURE_OPENAI_API_KEY,GOOGLE_VERTEX_PROJECT_ID,AIHUBMIX_API_KEY,OPENROUTER_API_KEY,HUGGINGFACE_API_KEY,NVIDIA_API_KEY,FREEBUFF_AUTH_TOKEN,WEATHER_API_KEY,TAVILY_API_KEY,AI_PRIMARY_PROVIDER,AI_PRIMARY_MODEL,AI_FALLBACK_PROVIDER,AI_FALLBACK_MODEL,AI_EMBEDDINGS_PROVIDER,AI_EMBEDDINGS_MODEL,AZURE_OPENAI_ENDPOINT,AZURE_OPENAI_DEPLOYMENT_NAME,OLLAMA_HOST,OLLAMA_MODEL
          script: |
            set -euo pipefail
            cd /root/ag_extension_decision_support
            # Ensure remote uses HTTPS with token authentication
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            echo "=== before: current commit ==="
            git log -1 --oneline
            echo "=== git pull --ff-only origin stage ==="
            git fetch origin
            git pull --ff-only origin stage
            echo
            echo "=== after: new commit ==="
            git log -1 --oneline
            echo

            # Write LLM keys + selection vars into .env from workflow secrets/vars
            # (docker-compose.yml loads it via env_file: .env)
            if [ ! -f "ag-extension-dashboard/.env" ]; then
              cp ag-extension-dashboard/.env.example ag-extension-dashboard/.env 2>/dev/null || true
            fi
            for var in OPENAI_API_KEY GROQ_API_KEY ANTHROPIC_API_KEY AZURE_OPENAI_API_KEY GOOGLE_VERTEX_PROJECT_ID AIHUBMIX_API_KEY OPENROUTER_API_KEY HUGGINGFACE_API_KEY NVIDIA_API_KEY FREEBUFF_AUTH_TOKEN WEATHER_API_KEY TAVILY_API_KEY AI_PRIMARY_PROVIDER AI_PRIMARY_MODEL AI_FALLBACK_PROVIDER AI_FALLBACK_MODEL AI_EMBEDDINGS_PROVIDER AI_EMBEDDINGS_MODEL AZURE_OPENAI_ENDPOINT AZURE_OPENAI_DEPLOYMENT_NAME OLLAMA_HOST OLLAMA_MODEL; do
              val="${!var}"
              if [ -n "$val" ]; then
                sed -i "/^$var=/d" ag-extension-dashboard/.env
                printf '%s=%s\n' "$var" "$val" >> ag-extension-dashboard/.env
                echo "Updated $var in .env from GitHub secrets/variables"
              fi
            done

            # Ensure VAPID keys are configured in .env
            if [ -f .env ] && ! grep -q "VAPID_PUBLIC_KEY" .env 2>/dev/null; then
              echo "🔑 Generating VAPID keys..."
              KEYS=""
              if python3 -c "import cryptography" 2>/dev/null; then
                KEYS=$(python3 -c "from cryptography.hazmat.primitives.asymmetric import ec; from cryptography.hazmat.primitives import serialization; import base64; k=ec.generate_private_key(ec.SECP256R1()); print(base64.urlsafe_b64encode(k.public_key().public_bytes(serialization.Encoding.X962, serialization.PublicFormat.UncompressedPoint)).decode().rstrip('='), base64.urlsafe_b64encode(k.private_numbers().private_value.to_bytes(32, 'big')).decode().rstrip('='))" 2>/dev/null)
              fi
              if [ -z "$KEYS" ] && command -v node >/dev/null 2>&1; then
                KEYS=$(npx -y web-push generate-vapid-keys 2>/dev/null | grep -E '(Public|Private) Key:' | awk '{print $NF}' | tr '\n' ' ')
              fi
              if [ -z "$KEYS" ] || [ "$KEYS" = " " ]; then
                KEYS="BMGWTV-2nCZOhnQhuk4nRAzbpiMtjJnVdyPDXmxZuDzRVdQKV1P4rfYQ6QkxHl_uhGNZBfO8WqSeLSD1cNZJ5y0 f6DXhedi6HCcV9WafsBx0IIGnHqUmZG4a1I436Y_xaQ"
              fi
              PUB_KEY=$(echo "$KEYS" | awk '{print $1}')
              PRIV_KEY=$(echo "$KEYS" | awk '{print $2}')
              if [ -n "$PUB_KEY" ] && [ -n "$PRIV_KEY" ]; then
                echo "" >> .env
                echo "# ── VAPID Keys for Push Notifications ──" >> .env
                echo "VAPID_PUBLIC_KEY=$PUB_KEY" >> .env
                echo "VAPID_PRIVATE_KEY=$PRIV_KEY" >> .env
                echo "VAPID_EMAIL=mailto:admin@gpexts.com" >> .env
                echo "✅ Added VAPID keys to .env"
              fi
            fi

            # Pre-create external networks referenced by compose (ettametta_ettametta is external: true)
            echo "=== ensure external networks exist ==="
            docker network create --driver bridge ettametta_ettametta >/dev/null 2>&1 || true
            docker network create --driver bridge ag-network >/dev/null 2>&1 || true
            docker network ls --format "table {{.Name}}\t{{.Driver}}" | grep -E "ettametta_ettametta|ag-network|NETWORK" || true
            echo
            cd ag-extension-dashboard
            if [ ! -f docker-compose.staging.yml ]; then
              echo "❌ docker-compose.staging.yml not found in repo!" >&2
              exit 1
            fi

            echo "=== ensure db extensions exist (idempotent) ==="
            docker exec ag-dashboard-db psql \
              -U "${DATABASE_USER:-postgres}" \
              -d "${DATABASE_NAME:-ag_extension}" \
              -v ON_ERROR_STOP=1 \
              -c "CREATE EXTENSION IF NOT EXISTS vector;" \
              -c "CREATE EXTENSION IF NOT EXISTS postgis;" \
            || echo "(warning: app-db not running, or extension pre-create failed; continuing)"

            echo
            echo "=== build + recreate backend + frontend (staging override = production target) ==="
            # Pin Docker daemon DNS to Cloudflare+Google so BuildKit + compose pulls
            # bypass Contabo's flaky default resolver (209.126.15.53). The earlier
            # /etc/resolv.conf swap is fragile: on Ubuntu 22 it is a systemd-resolved
            # symlink that gets reverted, and host DNS does not propagate into a
            # buildkitd container that was already created with the broken one.
            # daemon.json is the authoritative knob and is read at daemon start.
            # 127.0.0.1 is appended LAST so it acts as a final-port fallback to
            # an `unbound` local DNS-over-TLS forwarder (TCP/853) for hosts
            # where Contabo blocks UDP/53 from the docker bridge subnet above
            # iptables (i.e., iptables fix is insufficient). The first two
            # entries cover the iptables-unblocked case at full UDP speed.
            TARGET_DNS='{"dns":["1.1.1.1","8.8.8.8","127.0.0.1"],"log-level":"warn"}'
            mkdir -p /etc/docker
            CLEAN_CURRENT=$(cat /etc/docker/daemon.json 2>/dev/null | tr -d ' \n\t' || echo '{}')
            CLEAN_TARGET=$(echo "$TARGET_DNS" | tr -d ' \n\t')
            if [ "$CLEAN_CURRENT" != "$CLEAN_TARGET" ]; then
              echo "$TARGET_DNS" > /etc/docker/daemon.json
              echo "Pinning Docker daemon DNS to 1.1.1.1 + 8.8.8.8..."
              echo "  Restarting Docker daemon to pick up new DNS..."
              systemctl restart docker
              for i in $(seq 1 30); do
                if docker info >/dev/null 2>&1; then
                  echo "  Docker daemon up after ${i}s."
                  break
                fi
                sleep 1
              done
              docker info >/dev/null 2>&1 || { echo "FATAL: Docker daemon did not come back up" >&2; exit 1; }
              echo "  /etc/docker/daemon.json written; daemon restarted."
            else
              echo "Docker daemon DNS already pinned (daemon.json matches target)."
            fi
            echo

            # Idempotently allow docker bridge → public UDP/53 egress.
            # `--driver-opt network=host` did not apply at lazy-spawn time
            # on the prior run (buildkti worker stayed on 172.17.0.0/16).
            # Counteract by ensuring the FORWARD + OUTPUT chains ACCEPT
            # UDP/53 to/from the bridge subnet regardless of buildx
            # network-mode behaviour.
            iptables -C FORWARD -s 172.17.0.0/16 -p udp --dport 53 -j ACCEPT 2>/dev/null || iptables -I FORWARD 1 -s 172.17.0.0/16 -p udp --dport 53 -j ACCEPT
            iptables -C FORWARD -d 172.17.0.0/16 -p udp --sport 53 -j ACCEPT 2>/dev/null || iptables -I FORWARD 1 -d 172.17.0.0/16 -p udp --sport 53 -j ACCEPT
            iptables -C OUTPUT  -s 172.17.0.0/16 -p udp --dport 53 -j ACCEPT 2>/dev/null || iptables -I OUTPUT  1 -s 172.17.0.0/16 -p udp --dport 53 -j ACCEPT
            echo "  iptables UDP/53 from 172.17.0.0/16: ensured"

            # Compose's --build spawns a buildkit worker container on the
            # default docker bridge (172.17.0.0/16). On this Contabo VPS that
            # subnet cannot egress UDP/53 to public resolvers (verified error
            # from the previous run: `dial tcp: lookup registry-1.docker.io on
            # 8.8.8.8:53: read udp 172.17.0.2:...->8.8.8.8:53: i/o timeout`),
            # so base pulls fail even after the daemon.json DNS pin.
            # `--driver-opt network=host` puts the worker in the host network
            # namespace — pulls go through the host's DNS path which works.
            # `--bootstrap` forces the worker container to be created and
            # started at instance-create time so the driver-opts apply to the
            # actual docker run invocation (the lazy-spawn path previously
            # ignored network=host).
            docker buildx rm stage-builder 2>/dev/null || true
            docker buildx create --use --driver docker-container --driver-opt "network=host" --name stage-builder --bootstrap
            export DOCKER_BUILDER=stage-builder

            docker compose \
              -f docker-compose.yml \
              -f docker-compose.staging.yml \
              up -d --build --force-recreate backend frontend ettametta-ollama
            echo
            echo "=== wait 30s for deps (db+redis) + build + boot ==="
            sleep 30
            echo
            echo "=== container status ==="
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" --filter "name=ag-dashboard"
            echo
            echo "=== backend health check (4 attempts + visible failure text) ==="
            HEALTH_PASS=0
            for i in 1 2 3 4; do
              if RESP=$(curl -sSf --max-time 10 http://127.0.0.1:7500/api/health 2>&1); then
                echo "✅ Backend is healthy! (attempt $i)"
                echo "$RESP" | head -3
                HEALTH_PASS=1
                break
              else
                echo "❌ Attempt $i failed."
                echo "----- last response -----"
                echo "$RESP" | head -10
                echo "------------------------"
                sleep 10
              fi
            done
            if [ "$HEALTH_PASS" != "1" ]; then
              echo "FATAL: Backend health check failed after 4 retries." >&2
              docker logs --tail 80 ag-dashboard-backend 2>/dev/null || true
              docker logs --tail 40 ag-dashboard-db    2>/dev/null || true
              exit 1
            fi
            echo
            echo "=== frontend TCP probe (informational) ==="
            curl -sSI --max-time 10 http://127.0.0.1:7503/ | head -3 || echo "(frontend probe did not return headers — non-fatal)"
            echo
            echo "✅ Deploy complete"
