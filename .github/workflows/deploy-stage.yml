name: Deploy to Stage (auto on push)

# Auto-deploys the testing server (145.223.97.248) whenever code is pushed
# to the stage branch. Local → remote is one-way automatic; do NOT edit files
# on the host directly — push to stage and let this workflow do the work.
#
# Required GitHub repo secrets:
#   - TEST_SERVER_IP            : the server IP (145.223.97.248)
#   - SSH_PRIVATE_KEY_TESTING   : contents of the SSH private key (id_key)
#
# This workflow ONLY recreates backend + frontend with the cached image
# (no rebuild, no DB migrations, no Redis touch). Use the full
# deploy-all.yml for production-grade deploys (CI checks, GHCR cache,
# parallel builds, agent services, disk cleanup).

on:
  push:
    branches:
      - stage
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Git pull + recreate app containers
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Pull latest stage and recreate backend + frontend
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.TEST_SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY_TESTING }}
          command_timeout: 10m
          script: |
            set -e
            cd /root/ag_extension_decision_support
            # Ensure remote uses HTTPS with token authentication
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            echo "=== before: current commit ==="
            git log -1 --oneline
            echo "=== git pull --ff-only origin stage ==="
            git fetch origin
            git pull --ff-only origin stage
            echo
            echo "=== after: new commit ==="
            git log -1 --oneline
            echo

            # Ensure VAPID keys are configured in .env
            if [ -f .env ] && ! grep -q "VAPID_PUBLIC_KEY" .env 2>/dev/null; then
              echo "🔑 Generating VAPID keys..."
              KEYS=""
              if python3 -c "import cryptography" 2>/dev/null; then
                KEYS=$(python3 -c "from cryptography.hazmat.primitives.asymmetric import ec; from cryptography.hazmat.primitives import serialization; import base64; k=ec.generate_private_key(ec.SECP256R1()); print(base64.urlsafe_b64encode(k.public_key().public_bytes(serialization.Encoding.X962, serialization.PublicFormat.UncompressedPoint)).decode().rstrip('='), base64.urlsafe_b64encode(k.private_numbers().private_value.to_bytes(32, 'big')).decode().rstrip('='))" 2>/dev/null)
              fi
              if [ -z "$KEYS" ] && command -v node >/dev/null 2>&1; then
                KEYS=$(npx -y web-push generate-vapid-keys 2>/dev/null | grep -E '(Public|Private) Key:' | awk '{print $NF}' | tr '\n' ' ')
              fi
              if [ -z "$KEYS" ] || [ "$KEYS" = " " ]; then
                KEYS="BMGWTV-2nCZOhnQhuk4nRAzbpiMtjJnVdyPDXmxZuDzRVdQKV1P4rfYQ6QkxHl_uhGNZBfO8WqSeLSD1cNZJ5y0 f6DXhedi6HCcV9WafsBx0IIGnHqUmZG4a1I436Y_xaQ"
              fi
              PUB_KEY=$(echo "$KEYS" | awk '{print $1}')
              PRIV_KEY=$(echo "$KEYS" | awk '{print $2}')
              if [ -n "$PUB_KEY" ] && [ -n "$PRIV_KEY" ]; then
                echo "" >> .env
                echo "# ── VAPID Keys for Push Notifications ──" >> .env
                echo "VAPID_PUBLIC_KEY=$PUB_KEY" >> .env
                echo "VAPID_PRIVATE_KEY=$PRIV_KEY" >> .env
                echo "VAPID_EMAIL=mailto:admin@gpexts.com" >> .env
                echo "✅ Added VAPID keys to .env"
              fi
            fi

            echo "=== recreate backend + frontend (cached image, no rebuild, no deps) ==="
            cd ag-extension-dashboard
            docker compose up -d --no-deps --no-build backend frontend 2>&1 | tail -10
            echo
            echo "=== wait 12s for boot ==="
            sleep 12
            echo
            echo "=== container status ==="
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" --filter "name=ag-dashboard"
            echo
            echo "=== quick health check (skip if curl missing) ==="
            curl -sI --max-time 8 http://127.0.0.1:7500/api/health 2>&1 | head -3 || echo "curl not available on host"
            echo
            echo "✅ Deploy complete"
