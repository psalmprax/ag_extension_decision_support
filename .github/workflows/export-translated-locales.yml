name: Export translated locales

# Prints the locale files from a `Translate locales` run into this run's log as
# a base64 tarball, for environments that can read run logs but not artifact
# storage. Read-only: it changes nothing in the repository.
#   gh run view <export run> --log | sed -n '/BEGIN-LOCALES/,/END-LOCALES/p'
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run id of the Translate locales run to export'
        required: true

permissions:
  actions: read
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download the translated locale files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: translated-locales*
          merge-multiple: true
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ github.token }}
          path: locales

      - name: Print them as a tarball
        run: |
          ls locales/*.json | wc -l
          sha256sum locales/*.json
          echo BEGIN-LOCALES
          tar -C locales -czf - . | base64 -w 120
          echo END-LOCALES
