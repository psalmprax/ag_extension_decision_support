name: Mobile App Store Release (Capacitor & Android)

on:
  push:
    branches: [master, stage]
    tags:
      - 'v*'
  workflow_dispatch:

# App-store uploads must not overlap: two runs would race on the same bundle id.
concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-mobile-web:
    name: Build PWA & Capacitor Web Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        working-directory: ag-extension-dashboard/src/frontend
        run: npm ci --workspaces=false
      - name: Run Typecheck & Tests
        working-directory: ag-extension-dashboard/src/frontend
        run: |
          npm run typecheck
          npm test

      - name: Build Production PWA Assets
        working-directory: ag-extension-dashboard/src/frontend
        run: npm run build

      - name: Sync Capacitor Assets
        working-directory: ag-extension-dashboard/src/frontend
        run: npx --yes @capacitor/cli sync

      - name: Upload Web Build Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gpexts-pwa-dist
          path: ag-extension-dashboard/src/frontend/dist/
          retention-days: 14

  package-android-apk:
    name: Package Android Release Artifacts
    needs: build-mobile-web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Java 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Download Built Web Assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: gpexts-pwa-dist
          path: ag-extension-dashboard/src/frontend/dist

      - name: Prepare Capacitor Android
        working-directory: ag-extension-dashboard/src/frontend
        run: |
          npm ci
          npx --yes @capacitor/cli sync android

      - name: Build Signed Android APK/AAB
        working-directory: ag-extension-dashboard/src/frontend/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/keystore.jks
            ./gradlew assembleRelease bundleRelease \
              -Pandroid.injected.signing.store.file=app/keystore.jks \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          else
            echo "No keystore secrets — building unsigned debug APK for validation"
            ./gradlew assembleDebug
          fi

      - name: Create Release Summary
        run: |
          mkdir -p build/outputs
          cp ag-extension-dashboard/src/frontend/android/app/build/outputs/bundle/release/*.aab build/outputs/ 2>/dev/null || true
          cp ag-extension-dashboard/src/frontend/android/app/build/outputs/apk/release/*.apk build/outputs/ 2>/dev/null || true
          cp ag-extension-dashboard/src/frontend/android/app/build/outputs/apk/debug/*.apk build/outputs/ 2>/dev/null || true
          ARTIFACT_COUNT=$(ls build/outputs/*.aab build/outputs/*.apk 2>/dev/null | wc -l)
          if [ "$ARTIFACT_COUNT" -eq 0 ]; then
            echo "::error::No APK/AAB produced by gradle — refusing to upload a manifest-only artifact claiming the build is ready."
            exit 1
          fi
          ls -lh build/outputs/
          {
            echo "GPExts Native App Store Build for com.gpexts.app"
            echo "Package ID: com.gpexts.app"
            echo "Artifacts: ${ARTIFACT_COUNT} file(s)"
            echo "Build Timestamp: $(date -u)"
          } > build/outputs/BUILD_MANIFEST.txt

      - name: Upload Native Release Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gpexts-native-build
          path: build/outputs/
          retention-days: 30
