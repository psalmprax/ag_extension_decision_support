name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'
          cache: 'npm'
          cache-dependency-path: ag-extension-dashboard/src/backend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: ag-extension-dashboard/src/backend
      - name: Lint
        run: npm run lint
        working-directory: ag-extension-dashboard/src/backend
      - name: Build
        run: npm run build
        working-directory: ag-extension-dashboard/src/backend
      - name: Test
        run: npm test -- --forceExit
        working-directory: ag-extension-dashboard/src/backend

  frontend-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'
          cache: 'npm'
          cache-dependency-path: ag-extension-dashboard/src/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: ag-extension-dashboard/src/frontend
      - name: Lint
        run: npm run lint
        working-directory: ag-extension-dashboard/src/frontend
      - name: Build
        run: npm run build
        working-directory: ag-extension-dashboard/src/frontend
      - name: Test
        run: npm test
        working-directory: ag-extension-dashboard/src/frontend
