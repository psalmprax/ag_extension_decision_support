name: AG-Extension Multi-Server Deployment

on:
  push:
    branches:
      - stage
      - master
      - 'feature/*'
  pull_request:
    branches:
      - master
    types: [closed]
  workflow_dispatch:
    inputs:
      force_clean_rebuild:
        description: 'Force clean rebuild (--no-cache) of all Docker images'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  # 1. CI Checks (Runs for all triggers)
  ci-checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: psalmprax
          POSTGRES_PASSWORD: password
          POSTGRES_DB: ag_extension
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            ag-extension-dashboard/src/frontend/package-lock.json
            ag-extension-dashboard/src/backend/package-lock.json

      - name: Lint, Build & Test Frontend (with coverage)
        run: |
          cd ag-extension-dashboard/src/frontend
          npm ci
          npm run lint
          npm run build
          npm run test:coverage

      - name: Install Playwright chromium
        run: |
          cd ag-extension-dashboard/src/frontend
          npx playwright install --with-deps chromium

      - name: Run Playwright e2e tests
        run: |
          cd ag-extension-dashboard/src/frontend
          npm run test:e2e

      - name: Lint, Build & Test Backend
        run: |
          cd ag-extension-dashboard/src/backend
          npm ci
          npx prisma generate
          npx prisma db push --skip-generate
          npm run shared:sync
          npm run lint
          npm run build
          npm test -- --forceExit
        env:
          DATABASE_URL: postgres://psalmprax:password@localhost:5432/ag_extension
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test

  # 2. Deploy to Testing — DISABLED (superseded by deploy-stage.yml)
  # deploy-stage.yml now owns all testing-server deploys and gates them on its
  # own ci-checks job. Keeping this job enabled would double-deploy to
  # TEST_SERVER_IP on every stage push (racing deploy-stage.yml). Re-enable
  # only if feature-branch auto-deploys to the shared testing server are wanted.
  deploy-testing:
    needs: ci-checks
    if: false
    runs-on: ubuntu-latest
    steps:
      # ── Step 1/5: Git sync & .env (fast) ─────────────────────
      - name: 1/5 Sync — git checkout + .env
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.TEST_SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY_TESTING }}
          command_timeout: 3m
          script: |
            set -e
            if [ ! -d "/root/ag_extension_decision_support" ]; then
              echo "Cloning repository..."
              cd /root && git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            fi
            cd /root/ag_extension_decision_support
            chmod -R u+rw .git 2>/dev/null || true
            rm -rf .git/config.lock .git/*.lock .git/refs/heads/*.lock 2>/dev/null || true
            # Ensure the remote uses HTTPS with token authentication
            if ! git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git; then
              echo "Git config failed; performing clean re-clone..."
              cd /root
              rm -rf /root/ag_extension_decision_support
              git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git ag_extension_decision_support
              cd /root/ag_extension_decision_support
            fi
            git fetch origin
            if git show-ref --verify --quiet refs/heads/${{ github.ref_name }}; then
              git checkout ${{ github.ref_name }}
            else
              git checkout -b ${{ github.ref_name }} origin/${{ github.ref_name }}
            fi
            git reset --hard origin/${{ github.ref_name }}
            cd /root/ag_extension_decision_support/ag-extension-dashboard
            if [ ! -f .env ]; then
              cp .env.example .env
              echo ".env created from .env.example"
            fi

            # Ensure VAPID keys are configured in .env
            if ! grep -q "VAPID_PUBLIC_KEY" .env 2>/dev/null; then
              echo "Generating VAPID keys..."
              KEYS=""
              if python3 -c "import cryptography" 2>/dev/null; then
                KEYS=$(python3 -c "from cryptography.hazmat.primitives.asymmetric import ec; from cryptography.hazmat.primitives import serialization; import base64; k=ec.generate_private_key(ec.SECP256R1()); print(base64.urlsafe_b64encode(k.public_key().public_bytes(serialization.Encoding.X962, serialization.PublicFormat.UncompressedPoint)).decode().rstrip('='), base64.urlsafe_b64encode(k.private_numbers().private_value.to_bytes(32, 'big')).decode().rstrip('='))" 2>/dev/null)
              fi
              if [ -z "$KEYS" ] && command -v node >/dev/null 2>&1; then
                KEYS=$(npx -y web-push generate-vapid-keys 2>/dev/null | grep -E '(Public|Private) Key:' | awk '{print $NF}' | tr '\n' ' ')
              fi
              if [ -z "$KEYS" ] || [ "$KEYS" = " " ]; then
                echo "FATAL: Unable to generate VAPID keys; refusing deployment with synthetic credentials." >&2
                exit 1
              fi
              PUB_KEY=$(echo "$KEYS" | awk '{print $1}')
              PRIV_KEY=$(echo "$KEYS" | awk '{print $2}')
              if [ -n "$PUB_KEY" ] && [ -n "$PRIV_KEY" ]; then
                echo "" >> .env
                echo "# VAPID Keys for Push Notifications" >> .env
                echo "VAPID_PUBLIC_KEY=$PUB_KEY" >> .env
                echo "VAPID_PRIVATE_KEY=$PRIV_KEY" >> .env
                echo "VAPID_EMAIL=mailto:admin@gpexts.com" >> .env
                echo "Added VAPID keys to .env"
              fi
            fi

            # Ensure JWT_SECRET is configured in .env
            if ! grep -q "^JWT_SECRET=[^[:space:]]\{16,\}" .env 2>/dev/null; then
              echo "Generating JWT_SECRET..."
              JWT_RAND=$(openssl rand -hex 32 2>/dev/null || node -e "console.log(require('crypto').randomBytes(32).toString('hex'))" 2>/dev/null || echo "jwt_secret_$(date +%s)")
              sed -i '/^JWT_SECRET=/d' .env 2>/dev/null || true
              echo "JWT_SECRET=$JWT_RAND" >> .env
              echo "Added JWT_SECRET to .env"
            fi

            # Ensure MCP_API_TOKEN is configured in .env
            if ! grep -q "^MCP_API_TOKEN=[^[:space:]]\{16,\}" .env 2>/dev/null; then
              echo "Generating MCP_API_TOKEN..."
              MCP_RAND=$(openssl rand -hex 32 2>/dev/null || node -e "console.log(require('crypto').randomBytes(32).toString('hex'))" 2>/dev/null || echo "mcp_token_$(date +%s)")
              sed -i '/^MCP_API_TOKEN=/d' .env 2>/dev/null || true
              echo "MCP_API_TOKEN=$MCP_RAND" >> .env
              echo "Added MCP_API_TOKEN to .env"
            fi

      # ── Step 2/5: Infrastructure — bring up app-db + redis ONLY ─
      # Migrations deliberately deferred to step 4/5 so we can build the fresh
      # backend image first (step 3/5) and avoid running migrations against a
      # stale image.
      - name: 2/5 Infra — start app-db + redis (no migrations yet)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.TEST_SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY_TESTING }}
          command_timeout: 6m
          script: |
            set -e
            cd /root/ag_extension_decision_support/ag-extension-dashboard
            COMPOSE_FILES="-f docker-compose.yml -f docker-compose.agents.yml"

            DB_UP=$(docker ps --filter "name=ag-dashboard-db" --filter "status=running" -q)
            REDIS_UP=$(docker ps --filter "name=ag-dashboard-redis" --filter "status=running" -q)

            if [ -z "$DB_UP" ] || [ -z "$REDIS_UP" ]; then
              echo "Databases down — building infrastructure..."
              docker compose $COMPOSE_FILES up -d --build app-db redis
            fi

            # Wait for app-db + redis to reach Healthy (compose healthcheck reports "healthy")
            echo "Waiting for app-db + redis to be healthy..."
            for i in $(seq 1 60); do
              DB_H=$(docker inspect --format='{{.State.Health.Status}}' ag-dashboard-db 2>/dev/null || echo 'unknown')
              REDIS_H=$(docker inspect --format='{{.State.Health.Status}}' ag-dashboard-redis 2>/dev/null || echo 'unknown')
              if [ "$DB_H" = "healthy" ] && [ "$REDIS_H" = "healthy" ]; then
                echo "  app-db=$DB_H  redis=$REDIS_H"
                echo "Both services healthy."
                exit 0
              fi
              if [ $((i % 10)) -eq 0 ]; then
                echo "  Attempt $i/60 — app-db=$DB_H  redis=$REDIS_H"
              fi
              sleep 2
            done
            echo "app-db or redis never reached healthy state after 120s" >&2
            docker logs --tail 80 ag-dashboard-db 2>/dev/null || true
            docker logs --tail 40 ag-dashboard-redis 2>/dev/null || true
            exit 1

      # ── Step 3/5: Build ALL services in parallel via BuildKit ─
      - name: 3/5 Build — all services in parallel (backend + frontend + agents)
        uses: appleboy/ssh-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          # Enables the `ai` Compose profile so the profile-gated
          # `ettametta-ollama` service starts alongside backend + frontend +
          # the agent services (declared in
          # ag-extension-dashboard/docker-compose.yml with `profiles: ["ai"]`;
          # see docs/COMPOSE_PROFILES.md).
          COMPOSE_PROFILES: ai
        with:
          host: ${{ secrets.TEST_SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY_TESTING }}
          # Extend the appleboy/ssh-action forwarding whitelist so the
          # step-level `env: COMPOSE_PROFILES: ai` actually reaches the
          # remote shell. Without this, ssh-action only forwards the named
          # vars and the local-LLM service stays profile-invisible.
          envs: GITHUB_TOKEN,GITHUB_REPOSITORY,GITHUB_REPOSITORY_OWNER,COMPOSE_PROFILES
          command_timeout: 1240m
          script: |
            set -e
            cd /root/ag_extension_decision_support/ag-extension-dashboard
            # Pin Docker daemon DNS to Cloudflare+Google so BuildKit + compose pulls
            # bypass Contabo's flaky default resolver (209.126.15.53). The earlier
            # /etc/resolv.conf swap is fragile: on Ubuntu 22 it is a systemd-resolved
            # symlink that gets reverted, and host DNS does not propagate into a
            # buildkitd container that was already created with the broken one.
            # daemon.json is the authoritative knob and is read at daemon start.
            # 127.0.0.1 is appended LAST so it acts as a final-port fallback to
            # an `unbound` local DNS-over-TLS forwarder (TCP/853) for hosts
            # where Contabo blocks UDP/53 from the docker bridge subnet above
            # iptables (i.e., iptables fix is insufficient). The first two
            # entries cover the iptables-unblocked case at full UDP speed.
            TARGET_DNS='{"dns":["1.1.1.1","8.8.8.8","127.0.0.1"],"log-level":"warn"}'
            mkdir -p /etc/docker
            CLEAN_CURRENT=$(cat /etc/docker/daemon.json 2>/dev/null | tr -d ' \n\t' || echo '{}')
            CLEAN_TARGET=$(echo "$TARGET_DNS" | tr -d ' \n\t')
            if [ "$CLEAN_CURRENT" != "$CLEAN_TARGET" ]; then
              echo "$TARGET_DNS" > /etc/docker/daemon.json
              echo "Pinning Docker daemon DNS to 1.1.1.1 + 8.8.8.8..."
              echo "  Restarting Docker daemon to pick up new DNS..."
              systemctl restart docker
              for i in $(seq 1 30); do
                if docker info >/dev/null 2>&1; then
                  echo "  Docker daemon up after ${i}s."
                  break
                fi
                sleep 1
              done
              docker info >/dev/null 2>&1 || { echo "FATAL: Docker daemon did not come back up" >&2; exit 1; }
              # The restart tears down the cached buildkitd container; force a
              # fresh buildx instance below so the new buildkitd inherits the
              # new daemon DNS instead of the inherited broken resolvers.
              docker buildx rm remote-builder 2>/dev/null || true
              echo "  /etc/docker/daemon.json written; daemon restarted; remote-builder cleared."
            else
              echo "Docker daemon DNS already pinned (daemon.json matches target)."
            fi

            # Idempotently allow docker bridge → public UDP/53 egress.
            # Buildx `--driver-opt network=host` did not apply at lazy-spawn
            # time on the prior run (buildkti worker stayed on 172.17.0.0/16
            # — confirmed by the same i/o-timeout error pattern). Counteract
            # by ensuring the FORWARD + OUTPUT chains ACCEPT UDP/53 to/from
            # the bridge subnet regardless of buildx network-mode behaviour.
            # `iptables -C` exits 0 when rule exists → we skip the -I insert.
            iptables -C FORWARD -s 172.17.0.0/16 -p udp --dport 53 -j ACCEPT 2>/dev/null || iptables -I FORWARD 1 -s 172.17.0.0/16 -p udp --dport 53 -j ACCEPT
            iptables -C FORWARD -d 172.17.0.0/16 -p udp --sport 53 -j ACCEPT 2>/dev/null || iptables -I FORWARD 1 -d 172.17.0.0/16 -p udp --sport 53 -j ACCEPT
            iptables -C OUTPUT  -s 172.17.0.0/16 -p udp --dport 53 -j ACCEPT 2>/dev/null || iptables -I OUTPUT  1 -s 172.17.0.0/16 -p udp --dport 53 -j ACCEPT
            echo "  iptables UDP/53 from 172.17.0.0/16: ensured"

            # Proactively prune dangling images and old builder cache to preserve disk space
            echo "Pruning dangling images and builder cache..."
            docker image prune -f 2>/dev/null || true
            docker builder prune -f --filter "until=24h" 2>/dev/null || true

            # Always ensure remote-builder is created and active
            docker buildx rm remote-builder 2>/dev/null || true
            docker buildx create --use --driver docker-container --driver-opt "network=host" --name remote-builder --bootstrap

            # The `type=local` cache exporter writes a transient `ingest/` tree
            # under each target's cache dir and renames startedat.tmp -> startedat
            # on completion. An interrupted build (e.g. the daemon restart above)
            # can leave that tree half-written, so the next export fails with
            # "rename .../startedat.tmp ...: no such file or directory". Removing
            # stale ingest dirs before baking lets the exporter start clean.
            find /root/docker-cache -type d -name ingest -prune -exec rm -rf {} + 2>/dev/null || true
            echo "  Stale local-cache ingest state cleared."

            CLEAN_REBUILD="${{ github.event.inputs.force_clean_rebuild == 'true' && '--no-cache' || '' }}"

            if [ -n "$CLEAN_REBUILD" ]; then
              echo "Clean rebuild forced — building without cache in batches..."
              docker buildx bake --allow=fs=/root --load -f docker-bake.hcl backend frontend
              docker buildx bake --allow=fs=/root --load -f docker-bake.hcl agent-zero crew-ai discovery-scraper
            else
              echo "Authenticating to GHCR for remote Docker layer cache..."
              echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_REPOSITORY_OWNER" --password-stdin 2>/dev/null

              # Batched bake: build web apps (backend + frontend) first, then background agents & scraper.
              # This cuts peak memory and concurrent layer extraction in half, preventing buildkitd OOM / transport drops.
              run_bake() {
                echo "==> [Bake 1/2] Building web services (backend, frontend)..."
                docker buildx bake --allow=fs=/root --load -f docker-bake.hcl backend frontend
                echo "==> [Bake 2/2] Building agent & scraper services (agent-zero, crew-ai, discovery-scraper)..."
                docker buildx bake --allow=fs=/root --load -f docker-bake.hcl agent-zero crew-ai discovery-scraper
              }

              echo "Building with remote cache (GHCR)..."
              if ! BAKE_OUTPUT=$(run_bake 2>&1); then
                echo "Bake failed — checking failure reason..."
                echo "$BAKE_OUTPUT" | tail -40
                if echo "$BAKE_OUTPUT" | grep -qE "startedat\.tmp|error writing layer blob|ingest/|connection error|graceful_stop|EOF|Unavailable|transport is closing|failed to receive status"; then
                  echo "Recoverable builder transport or cache-export issue detected. Resetting builder, clearing stale ingest state, and retrying..."
                  find /root/docker-cache -type d -name ingest -prune -exec rm -rf {} + 2>/dev/null || true
                  docker buildx rm remote-builder 2>/dev/null || true
                  docker buildx create --use --driver docker-container --driver-opt "network=host" --name remote-builder --bootstrap
                  BAKE_OUTPUT=$(run_bake 2>&1) || { echo "$BAKE_OUTPUT" | tail -40; echo "FATAL: Bake failed after builder reset & cache cleanup retry." >&2; exit 1; }
                else
                  echo "$BAKE_OUTPUT" >&2
                  echo "FATAL: Bake failed for a non-cache reason." >&2
                  exit 1
                fi
              fi
              echo "$BAKE_OUTPUT" | tail -5
            fi

            # Pre-create external networks referenced by compose
            docker network create --driver bridge ettametta_ettametta >/dev/null 2>&1 || true
            docker network create --driver bridge ag-network >/dev/null 2>&1 || true

            # Remove any orphaned containers from previous runs
            docker compose -f docker-compose.yml -f docker-compose.agents.yml down --remove-orphans 2>/dev/null || true
            docker rm -f ag-discovery-scraper ag-agent-zero ag-crew-ai 2>/dev/null || true

            # Ensure MCP_API_TOKEN is present in .env before compose up
            if ! grep -q "^MCP_API_TOKEN=[^[:space:]]\{16,\}" .env 2>/dev/null; then
              MCP_RAND=$(openssl rand -hex 32 2>/dev/null || node -e "console.log(require('crypto').randomBytes(32).toString('hex'))" 2>/dev/null || echo "mcp_token_$(date +%s)")
              sed -i '/^MCP_API_TOKEN=/d' .env 2>/dev/null || true
              echo "MCP_API_TOKEN=$MCP_RAND" >> .env
            fi

            echo "Starting all services..."
            docker compose -f docker-compose.yml -f docker-compose.agents.yml up -d --force-recreate --no-build backend frontend agent-zero crew-ai discovery-scraper ettametta-ollama

      # ── Step 4/5: Migrations against the FRESHLY BUILT backend image ──
      # Two reliability fixes vs. the prior 2/4 step:
      #   (a) Pre-create pgvector + postgis extensions so raw SQL in any
      #       later DDL or app-level provisioning won't trip on missing
      #       types. CREATE EXTENSION IF NOT EXISTS is idempotent.
      #   (b) The retry loop previously captured $MIGRATE_OUTPUT but only
      #       inspected it for P1000/P3005, throwing every other failure
      #       message away. Now we surface the last 40 lines on every
      #       non-handled failure so the next CI run gives real evidence.
      - name: 4/5 Migrate — prisma migrate deploy (extension pre-create + visible retry)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.TEST_SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY_TESTING }}
          command_timeout: 20m
          script: |
            set -e
            cd /root/ag_extension_decision_support/ag-extension-dashboard
            COMPOSE_FILES="-f docker-compose.yml -f docker-compose.agents.yml"

            echo "Ensuring pgvector + postgis extensions exist..."
            docker compose $COMPOSE_FILES exec -T app-db \
              psql -U "${DATABASE_USER:-postgres}" \
                   -d "${DATABASE_NAME:-ag_extension}" \
                   -v ON_ERROR_STOP=1 \
                   -c "CREATE EXTENSION IF NOT EXISTS vector;" \
                   -c "CREATE EXTENSION IF NOT EXISTS postgis;" \
              || echo "  (extension pre-create warning — migrate deploy will surface real cause if this matters)"

            echo "Running database migrations..."
            docker compose $COMPOSE_FILES run --rm backend bash -c '
              MIGRATION_DONE=0
              MIGRATE_OUTPUT=""
              for i in $(seq 1 30); do
                MIGRATE_OUTPUT=$(npx prisma migrate deploy 2>&1) && { echo "Migrations up to date."; MIGRATION_DONE=1; break; }
                if echo "$MIGRATE_OUTPUT" | grep -q P1000; then
                  echo "FATAL: Database auth failed (P1000)." >&2
                  echo "----- last migrate output -----" >&2
                  echo "$MIGRATE_OUTPUT" >&2
                  echo "-------------------------------" >&2
                  exit 1
                fi
                if echo "$MIGRATE_OUTPUT" | grep -q P3005; then
                  echo "P3005 detected — baselining existing DB to 0_init..."
                  mkdir -p prisma/migrations/0_init
                  npx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > prisma/migrations/0_init/migration.sql
                  npx prisma migrate resolve --applied 0_init
                  npx prisma migrate deploy
                  MIGRATION_DONE=1
                  break
                fi
                if echo "$MIGRATE_OUTPUT" | grep -qE "(already exists|P3018|P3009)"; then
                  FAILED_MIG=$(echo "$MIGRATE_OUTPUT" | grep -oE "Migration name: [0-9]+_[a-zA-Z0-9_]+" | cut -d" " -f3 || true)
                  if [ -z "$FAILED_MIG" ]; then
                    FAILED_MIG=$(echo "$MIGRATE_OUTPUT" | grep -oE "The \`[0-9]+_[a-zA-Z0-9_]+\` migration started at" | cut -d"\`" -f2 || true)
                  fi
                  if [ -n "$FAILED_MIG" ]; then
                    echo "Schema collision detected for migration $FAILED_MIG. Resolving as applied..."
                    npx prisma migrate resolve --applied "$FAILED_MIG"
                    continue
                  fi
                fi
                # Visibility: surface the actual error from each failed attempt (was previously silent).
                echo "Attempt $i/30 failed. Last migrate output:"
                echo "---"
                echo "$MIGRATE_OUTPUT" | tail -40
                echo "---"
                echo "Waiting for database... ($i/30)"
                sleep 2
              done
              if [ "$MIGRATION_DONE" != "1" ]; then
                echo "FATAL: Migration failed after 30 retries." >&2
                echo "----- last migrate output -----" >&2
                echo "$MIGRATE_OUTPUT" >&2
                echo "-------------------------------" >&2
                exit 1
              fi
            '

      - name: 4.5/5 Idempotent Seed — check and populate seed data if empty
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.TEST_SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY_TESTING }}
          command_timeout: 3m
          script: |
            docker exec ag-dashboard-backend npx prisma db seed

      # ── Step 5/5: Health Check — verify services are up ─────────────────────
      - name: 5/5 Health Check — verify services
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.TEST_SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY_TESTING }}
          command_timeout: 3m
          script: |
            echo "Waiting for backend to become healthy..."
            for i in $(seq 1 15); do
              if curl -fsSL --max-time 10 http://localhost:7500/health 2>/dev/null || curl -fsSL --max-time 10 http://localhost:7500/api/health 2>/dev/null || docker compose exec -T backend wget -qO- http://localhost:7500/health 2>/dev/null; then
                echo "Backend is healthy!"
                exit 0
              fi
              echo "  Attempt $i/15 — waiting 5s..."
              sleep 5
            done
            echo "Backend health check failed after 15 attempts"
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" || true
            exit 1

  # 3. Deploy to Production (New Server) — 5 timed steps, parallel builds via BuildKit
  deploy-production:
    needs: ci-checks
    if: (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.base_ref == 'master') || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      # ── Step 1/5: Git sync & .env with GitHub Secrets ──────────
      - name: 1/5 Sync — git checkout + .env
        uses: appleboy/ssh-action@master
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          # LLM provider API keys (secrets)
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          GOOGLE_VERTEX_PROJECT_ID: ${{ secrets.GOOGLE_VERTEX_PROJECT_ID }}
          AIHUBMIX_API_KEY: ${{ secrets.AIHUBMIX_API_KEY || vars.AIHUBMIX_API_KEY || secrets.AIHUBMIX_KEY || vars.AIHUBMIX_KEY || '' }}
          AIHUBMIX_ACCESS_KEY: ${{ secrets.AIHUBMIX_ACCESS_KEY || vars.AIHUBMIX_ACCESS_KEY || '' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          FREEBUFF_AUTH_TOKEN: ${{ secrets.FREEBUFF_AUTH_TOKEN }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          WEATHER_API_URL: ${{ secrets.WEATHER_API_URL || vars.WEATHER_API_URL || 'https://api.weatherapi.com/v1' }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
          DEMO_ENABLED: ${{ secrets.DEMO_ENABLED }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
          # LLM selection & endpoint config (repo variables or secrets)
          AI_PRIMARY_PROVIDER: ${{ secrets.AI_PRIMARY_PROVIDER || vars.AI_PRIMARY_PROVIDER || 'aihubmix' }}
          AI_PRIMARY_MODEL: ${{ secrets.AI_PRIMARY_MODEL || vars.AI_PRIMARY_MODEL || 'gemini-2.5-flash' }}
          AIHUBMIX_WEB_SEARCH: ${{ secrets.AIHUBMIX_WEB_SEARCH || vars.AIHUBMIX_WEB_SEARCH || 'true' }}
          AI_FALLBACK_PROVIDER: ${{ secrets.AI_FALLBACK_PROVIDER || vars.AI_FALLBACK_PROVIDER || 'ollama' }}
          AI_FALLBACK_MODEL: ${{ secrets.AI_FALLBACK_MODEL || vars.AI_FALLBACK_MODEL || 'llama3.2:3b' }}
          AI_EMBEDDINGS_PROVIDER: ${{ secrets.AI_EMBEDDINGS_PROVIDER || vars.AI_EMBEDDINGS_PROVIDER || 'openai' }}
          AI_EMBEDDINGS_MODEL: ${{ secrets.AI_EMBEDDINGS_MODEL || vars.AI_EMBEDDINGS_MODEL || 'text-embedding-3-large' }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT || vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_DEPLOYMENT_NAME: ${{ secrets.AZURE_OPENAI_DEPLOYMENT_NAME || vars.AZURE_OPENAI_DEPLOYMENT_NAME || 'gpt-4' }}
          OLLAMA_HOST: ${{ secrets.OLLAMA_HOST || vars.OLLAMA_HOST || 'http://ettametta-ollama:11434' }}
          OLLAMA_MODEL: ${{ secrets.OLLAMA_MODEL || vars.OLLAMA_MODEL || 'llama3.2:3b' }}
          MCP_API_TOKEN: ${{ secrets.MCP_API_TOKEN || vars.MCP_API_TOKEN }}
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY_PRODUCTION }}
          envs: JWT_SECRET,OPENAI_API_KEY,GROQ_API_KEY,ANTHROPIC_API_KEY,AZURE_OPENAI_API_KEY,GOOGLE_VERTEX_PROJECT_ID,AIHUBMIX_API_KEY,AIHUBMIX_ACCESS_KEY,OPENROUTER_API_KEY,HUGGINGFACE_API_KEY,NVIDIA_API_KEY,FREEBUFF_AUTH_TOKEN,WEATHER_API_KEY,WEATHER_API_URL,TAVILY_API_KEY,ACME_EMAIL,DEMO_ENABLED,DEMO_PASSWORD,AI_PRIMARY_PROVIDER,AI_PRIMARY_MODEL,AIHUBMIX_WEB_SEARCH,AI_FALLBACK_PROVIDER,AI_FALLBACK_MODEL,AI_EMBEDDINGS_PROVIDER,AI_EMBEDDINGS_MODEL,AZURE_OPENAI_ENDPOINT,AZURE_OPENAI_DEPLOYMENT_NAME,OLLAMA_HOST,OLLAMA_MODEL,MCP_API_TOKEN
          command_timeout: 3m
          script: |
            set -ex
            df -h
            docker system prune -f || true
            if [ ! -d "/root/ag_extension_decision_support/.git" ]; then
              rm -rf /root/ag_extension_decision_support
              cd /root && git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git ag_extension_decision_support
            fi
            cd /root/ag_extension_decision_support
            chmod -R u+rw .git 2>/dev/null || true
            rm -rf .git/config.lock .git/*.lock .git/refs/heads/*.lock 2>/dev/null || true
            if ! git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git; then
              echo "Git config failed; performing clean re-clone..."
              cd /root
              rm -rf /root/ag_extension_decision_support
              git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git ag_extension_decision_support
              cd /root/ag_extension_decision_support
            fi
            git fetch origin master
            git checkout master
            git reset --hard origin/master
            cd /root/ag_extension_decision_support/ag-extension-dashboard

            if [ ! -f ".env" ]; then
              cp .env.example .env
              echo ".env created from .env.example"
            fi

            for var in JWT_SECRET OPENAI_API_KEY GROQ_API_KEY ANTHROPIC_API_KEY AZURE_OPENAI_API_KEY GOOGLE_VERTEX_PROJECT_ID AIHUBMIX_API_KEY AIHUBMIX_ACCESS_KEY OPENROUTER_API_KEY HUGGINGFACE_API_KEY NVIDIA_API_KEY FREEBUFF_AUTH_TOKEN WEATHER_API_KEY WEATHER_API_URL TAVILY_API_KEY ACME_EMAIL DEMO_ENABLED DEMO_PASSWORD AI_PRIMARY_PROVIDER AI_PRIMARY_MODEL AIHUBMIX_WEB_SEARCH AI_FALLBACK_PROVIDER AI_FALLBACK_MODEL AI_EMBEDDINGS_PROVIDER AI_EMBEDDINGS_MODEL AZURE_OPENAI_ENDPOINT AZURE_OPENAI_DEPLOYMENT_NAME OLLAMA_HOST OLLAMA_MODEL MCP_API_TOKEN; do
              val="${!var}"
              if [ -n "$val" ]; then
                # Remove existing key if it exists
                sed -i "/^$var=/d" .env
                # Append the new key/value
                printf '%s=%s\n' "$var" "$val" >> .env
                echo "Updated $var in .env from GitHub secrets/variables"
              fi
            done

            # Ensure VAPID keys are configured in .env
            if ! grep -q "VAPID_PUBLIC_KEY" .env 2>/dev/null; then
              echo "Generating VAPID keys..."
              KEYS=""
              if python3 -c "import cryptography" 2>/dev/null; then
                KEYS=$(python3 -c "from cryptography.hazmat.primitives.asymmetric import ec; from cryptography.hazmat.primitives import serialization; import base64; k=ec.generate_private_key(ec.SECP256R1()); print(base64.urlsafe_b64encode(k.public_key().public_bytes(serialization.Encoding.X962, serialization.PublicFormat.UncompressedPoint)).decode().rstrip('='), base64.urlsafe_b64encode(k.private_numbers().private_value.to_bytes(32, 'big')).decode().rstrip('='))" 2>/dev/null)
              fi
              if [ -z "$KEYS" ] && command -v node >/dev/null 2>&1; then
                KEYS=$(npx -y web-push generate-vapid-keys 2>/dev/null | grep -E '(Public|Private) Key:' | awk '{print $NF}' | tr '\n' ' ')
              fi
              if [ -z "$KEYS" ] || [ "$KEYS" = " " ]; then
                echo "FATAL: Unable to generate VAPID keys; refusing deployment with synthetic credentials." >&2
                exit 1
              fi
              PUB_KEY=$(echo "$KEYS" | awk '{print $1}')
              PRIV_KEY=$(echo "$KEYS" | awk '{print $2}')
              if [ -n "$PUB_KEY" ] && [ -n "$PRIV_KEY" ]; then
                echo "" >> .env
                echo "# VAPID Keys for Push Notifications" >> .env
                echo "VAPID_PUBLIC_KEY=$PUB_KEY" >> .env
                echo "VAPID_PRIVATE_KEY=$PRIV_KEY" >> .env
                echo "VAPID_EMAIL=mailto:admin@gpexts.com" >> .env
                echo "Added VAPID keys to .env"
              fi
            fi

            # Ensure JWT_SECRET is configured in .env
            if ! grep -q "^JWT_SECRET=[^[:space:]]\{16,\}" .env 2>/dev/null; then
              echo "Generating JWT_SECRET..."
              JWT_RAND=$(openssl rand -hex 32 2>/dev/null || node -e "console.log(require('crypto').randomBytes(32).toString('hex'))" 2>/dev/null || echo "jwt_secret_$(date +%s)")
              sed -i '/^JWT_SECRET=/d' .env 2>/dev/null || true
              echo "JWT_SECRET=$JWT_RAND" >> .env
              echo "Added JWT_SECRET to .env"
            fi

            # Ensure MCP_API_TOKEN is configured in .env
            if ! grep -q "^MCP_API_TOKEN=[^[:space:]]\{16,\}" .env 2>/dev/null; then
              echo "Generating MCP_API_TOKEN..."
              MCP_RAND=$(openssl rand -hex 32 2>/dev/null || node -e "console.log(require('crypto').randomBytes(32).toString('hex'))" 2>/dev/null || echo "mcp_token_$(date +%s)")
              sed -i '/^MCP_API_TOKEN=/d' .env 2>/dev/null || true
              echo "MCP_API_TOKEN=$MCP_RAND" >> .env
              echo "Added MCP_API_TOKEN to .env"
            fi

      # ── Step 2/5: Infrastructure — bring up app-db + redis ONLY ─
      - name: 2/5 Infra — start app-db + redis (no migrations yet)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY_PRODUCTION }}
          command_timeout: 6m
          script: |
            set -e
            cd /root/ag_extension_decision_support/ag-extension-dashboard
            COMPOSE_FILES="-f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.agents.yml"

            DB_UP=$(docker ps --filter "name=ag-dashboard-db" --filter "status=running" -q)
            REDIS_UP=$(docker ps --filter "name=ag-dashboard-redis" --filter "status=running" -q)

            if [ -z "$DB_UP" ] || [ -z "$REDIS_UP" ]; then
              echo "Databases down — building infrastructure..."
              docker compose $COMPOSE_FILES up -d --build app-db redis
            fi

            echo "Waiting for app-db + redis to be healthy..."
            for i in $(seq 1 60); do
              DB_H=$(docker inspect --format='{{.State.Health.Status}}' ag-dashboard-db 2>/dev/null || echo 'unknown')
              REDIS_H=$(docker inspect --format='{{.State.Health.Status}}' ag-dashboard-redis 2>/dev/null || echo 'unknown')
              if [ "$DB_H" = "healthy" ] && [ "$REDIS_H" = "healthy" ]; then
                echo "  app-db=$DB_H  redis=$REDIS_H"
                echo "Both services healthy."
                exit 0
              fi
              if [ $((i % 10)) -eq 0 ]; then
                echo "  Attempt $i/60 — app-db=$DB_H  redis=$REDIS_H"
              fi
              sleep 2
            done
            echo "app-db or redis never reached healthy state after 120s" >&2
            docker logs --tail 80 ag-dashboard-db 2>/dev/null || true
            docker logs --tail 40 ag-dashboard-redis 2>/dev/null || true
            exit 1

      # ── Pre-build smoke gate: verify ettametta-ollama is live before the long
      # parallel build. Same pattern as deploy-stage.yml's gate: dedicated step,
      # 10m budget, retries 18 × 10s = ~350s worst case, on-fail diagnostic dump.
      # NOTE: no `env: COMPOSE_PROFILES: ai` here on purpose.
      # `docker compose ps -a --services` is profile-agnostic — services are
      # project-defined and enumerated regardless of profile activation — so
      # the gate intentionally inspects the full service list. Mirroring the
      # build step's env would be dead code-with-no-`with.envs:`-forward and
      # would mislead future readers into thinking the gate was profile-aware.
      - name: "Pre-build smoke gate: verify ettametta-ollama"
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY_PRODUCTION }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd /root/ag_extension_decision_support/ag-extension-dashboard
            # Pre-build smoke gate with `--if-running`: probes existing containers if
            # running, but permits recovery deploys to proceed to Step 3/5 where
            # backend and ettametta-ollama are launched.
            if ! bash /root/ag_extension_decision_support/scripts/smoke-ollama.sh --if-running --retries 18 --interval 10; then
              echo "FATAL: ettametta-ollama smoke gate failed (service broken or unreachable)." >&2
              echo "----- ettametta-ollama container logs (last 50 lines, if present) -----"
              docker compose logs --tail 50 ettametta-ollama 2>&1 || echo "(no logs: container not present in this compose project)"
              echo "------------------------------------------------------------"
              exit 1
            fi
            echo "✅ Pre-build smoke gate passed"

      # ── Step 3/5: Build ALL services in parallel ─────────────────────
      - name: 3/5 Build — all services in parallel (backend + frontend + agents)
        uses: appleboy/ssh-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          # Enables the `ai` Compose profile so the profile-gated
          # `ettametta-ollama` service starts alongside backend + frontend +
          # the agent services (declared in
          # ag-extension-dashboard/docker-compose.yml with `profiles: ["ai"]`;
          # see docs/COMPOSE_PROFILES.md).
          COMPOSE_PROFILES: ai
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY_PRODUCTION }}
          # Extend the appleboy/ssh-action forwarding whitelist so the
          # step-level `env: COMPOSE_PROFILES: ai` actually reaches the
          # remote shell. Without this, ssh-action only forwards the named
          # vars and the local-LLM service stays profile-invisible.
          envs: GITHUB_TOKEN,GITHUB_REPOSITORY,GITHUB_REPOSITORY_OWNER,COMPOSE_PROFILES
          command_timeout: 1240m
          script: |
            set -e
            cd /root/ag_extension_decision_support/ag-extension-dashboard
            # Pin Docker daemon DNS to Cloudflare+Google so BuildKit + compose pulls
            # bypass Contabo's flaky default resolver (209.126.15.53). The earlier
            # /etc/resolv.conf swap is fragile: on Ubuntu 22 it is a systemd-resolved
            # symlink that gets reverted, and host DNS does not propagate into a
            # buildkitd container that was already created with the broken one.
            # daemon.json is the authoritative knob and is read at daemon start.
            # 127.0.0.1 is appended LAST so it acts as a final-port fallback to
            # an `unbound` local DNS-over-TLS forwarder (TCP/853) for hosts
            # where Contabo blocks UDP/53 from the docker bridge subnet above
            # iptables (i.e., iptables fix is insufficient). The first two
            # entries cover the iptables-unblocked case at full UDP speed.
            TARGET_DNS='{"dns":["1.1.1.1","8.8.8.8","127.0.0.1"],"log-level":"warn"}'
            mkdir -p /etc/docker
            CLEAN_CURRENT=$(cat /etc/docker/daemon.json 2>/dev/null | tr -d ' \n\t' || echo '{}')
            CLEAN_TARGET=$(echo "$TARGET_DNS" | tr -d ' \n\t')
            if [ "$CLEAN_CURRENT" != "$CLEAN_TARGET" ]; then
              echo "$TARGET_DNS" > /etc/docker/daemon.json
              echo "Pinning Docker daemon DNS to 1.1.1.1 + 8.8.8.8..."
              echo "  Restarting Docker daemon to pick up new DNS..."
              systemctl restart docker
              for i in $(seq 1 30); do
                if docker info >/dev/null 2>&1; then
                  echo "  Docker daemon up after ${i}s."
                  break
                fi
                sleep 1
              done
              docker info >/dev/null 2>&1 || { echo "FATAL: Docker daemon did not come back up" >&2; exit 1; }
              # The restart tears down the cached buildkitd container; force a
              # fresh buildx instance below so the new buildkitd inherits the
              # new daemon DNS instead of the inherited broken resolvers.
              docker buildx rm remote-builder 2>/dev/null || true
              echo "  /etc/docker/daemon.json written; daemon restarted; remote-builder cleared."
            else
              echo "Docker daemon DNS already pinned (daemon.json matches target)."
            fi

            # Idempotently allow docker bridge → public UDP/53 egress.
            # Buildx `--driver-opt network=host` did not apply at lazy-spawn
            # time on the prior run (buildkti worker stayed on 172.17.0.0/16
            # — confirmed by the same i/o-timeout error pattern). Counteract
            # by ensuring the FORWARD + OUTPUT chains ACCEPT UDP/53 to/from
            # the bridge subnet regardless of buildx network-mode behaviour.
            # `iptables -C` exits 0 when rule exists → we skip the -I insert.
            iptables -C FORWARD -s 172.17.0.0/16 -p udp --dport 53 -j ACCEPT 2>/dev/null || iptables -I FORWARD 1 -s 172.17.0.0/16 -p udp --dport 53 -j ACCEPT
            iptables -C FORWARD -d 172.17.0.0/16 -p udp --sport 53 -j ACCEPT 2>/dev/null || iptables -I FORWARD 1 -d 172.17.0.0/16 -p udp --sport 53 -j ACCEPT
            iptables -C OUTPUT  -s 172.17.0.0/16 -p udp --dport 53 -j ACCEPT 2>/dev/null || iptables -I OUTPUT  1 -s 172.17.0.0/16 -p udp --dport 53 -j ACCEPT
            echo "  iptables UDP/53 from 172.17.0.0/16: ensured"

            # Proactively prune dangling images and old builder cache to preserve disk space
            echo "Pruning dangling images and builder cache..."
            ROOT_USAGE=$(df / | awk 'NR==2 {print $5}' | tr -d '%')
            if [ "$ROOT_USAGE" -gt 70 ]; then
              echo "Disk usage high (${ROOT_USAGE}%) — clearing /root/docker-cache and builder caches..."
              rm -rf /root/docker-cache/* 2>/dev/null || true
              docker builder prune -af 2>/dev/null || true
              docker image prune -af 2>/dev/null || true
            else
              docker image prune -f 2>/dev/null || true
              docker builder prune -f 2>/dev/null || true
            fi

            # Always ensure remote-builder is created and active
            docker buildx rm -f remote-builder 2>/dev/null || true
            docker buildx create --use --driver docker-container --driver-opt "network=host" --name remote-builder --bootstrap

            # The `type=local` cache exporter writes a transient `ingest/` tree
            # under each target's cache dir and renames startedat.tmp -> startedat
            # on completion. An interrupted build (e.g. the daemon restart above)
            # can leave that tree half-written, so the next export fails with
            # "rename .../startedat.tmp ...: no such file or directory". Removing
            # stale ingest dirs before baking lets the exporter start clean.
            find /root/docker-cache -type d -name ingest -prune -exec rm -rf {} + 2>/dev/null || true
            echo "  Stale local-cache ingest state cleared."

            CLEAN_REBUILD="${{ github.event.inputs.force_clean_rebuild == 'true' && '--no-cache' || '' }}"

            if [ -n "$CLEAN_REBUILD" ]; then
              echo "Clean rebuild forced — building without cache in batches..."
              docker buildx bake --allow=fs=/root --load -f docker-bake.hcl backend frontend
              docker buildx bake --allow=fs=/root --load -f docker-bake.hcl agent-zero crew-ai discovery-scraper
            else
              echo "Authenticating to GHCR for remote Docker layer cache..."
              echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_REPOSITORY_OWNER" --password-stdin 2>/dev/null

              # Batched bake: build web apps (backend + frontend) first, then background agents & scraper.
              # This cuts peak memory and concurrent layer extraction in half, preventing buildkitd OOM / transport drops.
              run_bake() {
                echo "==> [Bake 1/2] Building web services (backend, frontend)..."
                docker buildx bake --allow=fs=/root --load -f docker-bake.hcl backend frontend
                echo "==> [Bake 2/2] Building agent & scraper services (agent-zero, crew-ai, discovery-scraper)..."
                docker buildx bake --allow=fs=/root --load -f docker-bake.hcl agent-zero crew-ai discovery-scraper
              }

              echo "Building with remote cache (GHCR)..."
              if ! BAKE_OUTPUT=$(run_bake 2>&1); then
                echo "Bake failed — checking failure reason..."
                echo "$BAKE_OUTPUT" | tail -40
                if echo "$BAKE_OUTPUT" | grep -qE "startedat\.tmp|error writing layer blob|ingest/|connection error|graceful_stop|EOF|Unavailable|transport is closing|failed to receive status|no space left on device|ResourceExhausted"; then
                  echo "Recoverable builder transport, disk-space, or cache issue detected. Purging local cache and retrying..."
                  rm -rf /root/docker-cache/* 2>/dev/null || true
                  docker builder prune -af 2>/dev/null || true
                  docker buildx rm -f remote-builder 2>/dev/null || true
                  docker buildx create --use --driver docker-container --driver-opt "network=host" --name remote-builder --bootstrap
                  if ! BAKE_OUTPUT=$(run_bake 2>&1); then
                    echo "$BAKE_OUTPUT" | tail -40
                    echo "Bake retry failed. Falling back to standard docker compose build..."
                    docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.agents.yml build backend frontend agent-zero crew-ai discovery-scraper
                  fi
                else
                  echo "$BAKE_OUTPUT" >&2
                  echo "FATAL: Bake failed for a non-cache reason." >&2
                  exit 1
                fi
              fi
              echo "$BAKE_OUTPUT" | tail -5
            fi

            # Pre-create external networks referenced by compose
            docker network create --driver bridge ettametta_ettametta >/dev/null 2>&1 || true
            docker network create --driver bridge ag-network >/dev/null 2>&1 || true

            # Remove any orphaned containers from previous runs
            docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.agents.yml down --remove-orphans 2>/dev/null || true
            docker rm -f ag-discovery-scraper ag-agent-zero ag-crew-ai 2>/dev/null || true

            # Ensure MCP_API_TOKEN is present in .env before compose up
            if ! grep -q "^MCP_API_TOKEN=[^[:space:]]\{16,\}" .env 2>/dev/null; then
              MCP_RAND=$(openssl rand -hex 32 2>/dev/null || node -e "console.log(require('crypto').randomBytes(32).toString('hex'))" 2>/dev/null || echo "mcp_token_$(date +%s)")
              sed -i '/^MCP_API_TOKEN=/d' .env 2>/dev/null || true
              echo "MCP_API_TOKEN=$MCP_RAND" >> .env
            fi

            echo "Starting all services..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.agents.yml up -d --force-recreate --no-build traefik backend frontend agent-zero crew-ai discovery-scraper ettametta-ollama

      # ── Step 4/5: Migrations against the FRESHLY BUILT backend image ──
      - name: 4/5 Migrate — prisma migrate deploy (extension pre-create + visible retry)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY_PRODUCTION }}
          command_timeout: 20m
          script: |
            set -e
            cd /root/ag_extension_decision_support/ag-extension-dashboard
            COMPOSE_FILES="-f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.agents.yml"

            echo "Ensuring pgvector + postgis extensions exist..."
            docker compose $COMPOSE_FILES exec -T app-db \
              psql -U "${DATABASE_USER:-postgres}" \
                   -d "${DATABASE_NAME:-ag_extension}" \
                   -v ON_ERROR_STOP=1 \
                   -c "CREATE EXTENSION IF NOT EXISTS vector;" \
                   -c "CREATE EXTENSION IF NOT EXISTS postgis;" \
              || echo "  (extension pre-create warning — migrate deploy will surface real cause if this matters)"

            echo "Running database migrations..."
            docker compose $COMPOSE_FILES run --rm backend bash -c '
              MIGRATION_DONE=0
              MIGRATE_OUTPUT=""
              for i in $(seq 1 30); do
                MIGRATE_OUTPUT=$(npx prisma migrate deploy 2>&1) && { echo "Migrations up to date."; MIGRATION_DONE=1; break; }
                if echo "$MIGRATE_OUTPUT" | grep -q P1000; then
                  echo "FATAL: Database auth failed (P1000)." >&2
                  echo "----- last migrate output -----" >&2
                  echo "$MIGRATE_OUTPUT" >&2
                  echo "-------------------------------" >&2
                  exit 1
                fi
                if echo "$MIGRATE_OUTPUT" | grep -q P3005; then
                  echo "P3005 detected — baselining existing DB to 0_init..."
                  mkdir -p prisma/migrations/0_init
                  npx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > prisma/migrations/0_init/migration.sql
                  npx prisma migrate resolve --applied 0_init
                  npx prisma migrate deploy
                  MIGRATION_DONE=1
                  break
                fi
                if echo "$MIGRATE_OUTPUT" | grep -qE "(already exists|P3018|P3009)"; then
                  FAILED_MIG=$(echo "$MIGRATE_OUTPUT" | grep -oE "Migration name: [0-9]+_[a-zA-Z0-9_]+" | cut -d" " -f3 || true)
                  if [ -z "$FAILED_MIG" ]; then
                    FAILED_MIG=$(echo "$MIGRATE_OUTPUT" | grep -oE "The \`[0-9]+_[a-zA-Z0-9_]+\` migration started at" | cut -d"\`" -f2 || true)
                  fi
                  if [ -n "$FAILED_MIG" ]; then
                    echo "Schema collision detected for migration $FAILED_MIG. Resolving as applied..."
                    npx prisma migrate resolve --applied "$FAILED_MIG"
                    continue
                  fi
                fi
                # Visibility: surface the actual error from each failed attempt (was previously silent).
                echo "Attempt $i/30 failed. Last migrate output:"
                echo "---"
                echo "$MIGRATE_OUTPUT" | tail -40
                echo "---"
                echo "Waiting for database... ($i/30)"
                sleep 2
              done
              if [ "$MIGRATION_DONE" != "1" ]; then
                echo "FATAL: Migration failed after 30 retries." >&2
                echo "----- last migrate output -----" >&2
                echo "$MIGRATE_OUTPUT" >&2
                echo "-------------------------------" >&2
                exit 1
              fi
            '

      # ── Step 4.5/5: Seed Database (Admin & Initial Users) ─────
      - name: 4.5/5 Idempotent Seed — check and populate seed data
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY_PRODUCTION }}
          command_timeout: 3m
          script: |
            cd /root/ag_extension_decision_support/ag-extension-dashboard
            COMPOSE_FILES="-f docker-compose.yml -f docker-compose.prod.yml"
            if docker compose $COMPOSE_FILES exec -T backend node prisma/seed.cjs; then
              echo "Seed completed with the compiled seed script."
            else
              docker compose $COMPOSE_FILES exec -T backend npx prisma db seed
            fi

      # ── Step 5/5: SSL + Health Check ──────────────────────────
      - name: 5/5 SSL & Health Check — verify certificate and services
        uses: appleboy/ssh-action@master
        env:
          ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY_PRODUCTION }}
          envs: ACME_EMAIL
          command_timeout: 5m
          script: |
            cd /root/ag_extension_decision_support/ag-extension-dashboard

            # Ensure ACME_EMAIL is in .env
            if ! grep -q "ACME_EMAIL" .env 2>/dev/null; then
              echo "ACME_EMAIL=${ACME_EMAIL:-admin@gpexts.com}" >> .env
              echo "Added ACME_EMAIL to .env"
            fi

            echo "Waiting for services to stabilize..."
            sleep 15

            echo ""
            echo "Checking SSL certificate..."
            CERT_SUBJECT=$(echo | openssl s_client -connect www.gpexts.com:443 -servername www.gpexts.com 2>/dev/null | openssl x509 -noout -subject 2>/dev/null || echo "UNKNOWN")
            echo "  Certificate: $CERT_SUBJECT"

            if echo "$CERT_SUBJECT" | grep -qi "TRAEFIK DEFAULT CERT"; then
              echo "Traefik serving default cert — triggering ACME renewal..."
              COMPOSE_FILES="-f docker-compose.yml -f docker-compose.prod.yml"
              docker compose $COMPOSE_FILES exec -T traefik rm -f /letsencrypt/acme.json 2>/dev/null || true
              VOLUME_PATH=$(docker volume inspect ag-extension-dashboard_traefik_letsencrypt -f '{{.Mountpoint}}' 2>/dev/null || echo "")
              if [ -n "$VOLUME_PATH" ] && [ -f "$VOLUME_PATH/acme.json" ]; then
                rm -f "$VOLUME_PATH/acme.json"
              fi
              docker compose $COMPOSE_FILES restart traefik
              echo "  Traefik restarted — cert should be issued within 60s"
            elif echo "$CERT_SUBJECT" | grep -qi "gpexts"; then
              echo "Valid SSL certificate detected"
            fi

            echo ""
            echo "Checking backend health..."
            for i in $(seq 1 10); do
              if curl -kfsSL --max-time 10 https://localhost/health 2>/dev/null || curl -fsSL --max-time 10 http://localhost:7500/health 2>/dev/null || curl -fsSL --max-time 10 http://localhost:7500/api/health 2>/dev/null || docker compose $COMPOSE_FILES exec -T backend wget -qO- http://localhost:7500/health 2>/dev/null; then
                echo "Backend is healthy!"
                exit 0
              fi
              echo "  Attempt $i/10 — waiting 5s..."
              sleep 5
            done
            echo "Backend health check did not pass — check manually"
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" || true
