name: AG-Extension Multi-Server Deployment

on:
  push:
    branches:
      - stage
      - 'feature/*'
  pull_request:
    branches:
      - master
    types: [closed]
  workflow_dispatch:
    inputs:
      force_clean_rebuild:
        description: 'Force clean rebuild (--no-cache) of all Docker images'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  # 1. CI Checks (Runs for all triggers)
  ci-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            ag-extension-dashboard/src/frontend/package-lock.json
            ag-extension-dashboard/src/backend/package-lock.json

      - name: Install Dependencies
        run: |
          cd ag-extension-dashboard
          npm install

      - name: Lint, Build & Test Frontend (with coverage)
        run: |
          cd ag-extension-dashboard/src/frontend
          npm ci
          npm run lint
          npm run build
          npm run test:coverage

      - name: Lint, Build & Test Backend
        run: |
          cd ag-extension-dashboard/src/backend
          npm ci
          npx prisma generate
          npm run lint
          npm run build
          npm test -- --forceExit

  # 2. Deploy to Testing (Old Server) — 4 timed steps, parallel builds via BuildKit
  deploy-testing:
    needs: ci-checks
    if: github.event_name == 'push' && (github.ref == 'refs/heads/stage' || startsWith(github.ref, 'refs/heads/feature/'))
    runs-on: ubuntu-latest
    steps:
      # ── Step 1/4: Git sync & .env (fast) ─────────────────────
      - name: 1/4 Sync — git checkout + .env
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.TEST_SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY_TESTING }}
          command_timeout: 3m
          script: |
            set -e
            if [ ! -d "/root/ag_extension_decision_support" ]; then
              echo "🚀 Cloning repository..."
              cd /root && git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            fi
            cd /root/ag_extension_decision_support/ag-extension-dashboard
            # Ensure the remote uses HTTPS with token authentication
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            git fetch origin
            if git show-ref --verify --quiet refs/heads/${{ github.ref_name }}; then
              git checkout ${{ github.ref_name }}
            else
              git checkout -b ${{ github.ref_name }} origin/${{ github.ref_name }}
            fi
            git reset --hard origin/${{ github.ref_name }}
            if [ ! -f .env ]; then
              cp .env.example .env
              echo ".env created from .env.example"
            fi

      # ── Step 2/4: Infrastructure & migrations (moderate) ─────
      - name: 2/4 Infra — database + migrations
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.TEST_SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY_TESTING }}
          command_timeout: 20m
          script: |
            set -e
            cd /root/ag_extension_decision_support/ag-extension-dashboard
            COMPOSE_FILES="-f docker-compose.yml -f docker-compose.agents.yml"

            DB_UP=$(docker ps --filter "name=ag-dashboard-db" --filter "status=running" -q)
            REDIS_UP=$(docker ps --filter "name=ag-dashboard-redis" --filter "status=running" -q)

            if [ -z "$DB_UP" ] || [ -z "$REDIS_UP" ]; then
              echo "📦 Databases down — building infrastructure..."
              docker compose $COMPOSE_FILES up -d --build app-db redis
            fi

            echo "🗄️ Running database migrations..."
            # Conditional handling for JWT_SECRET
            if [ -z "${JWT_SECRET}" ]; then
              echo "⚠️ JWT_SECRET not set – using placeholder value"
              export JWT_SECRET="placeholder"
            else
              export JWT_SECRET
            fi
            # Network ettametta_ettametta is marked external: true in docker-compose.yml
            # so Docker Compose will use the pre-existing network without label conflicts
            docker compose $COMPOSE_FILES run --rm backend bash -c '
              MIGRATION_DONE=0
              for i in {1..30}; do
                MIGRATE_OUTPUT=$(npx prisma migrate deploy 2>&1) && { echo "Migrations up to date."; MIGRATION_DONE=1; break; }
                if echo "$MIGRATE_OUTPUT" | grep -q P1000; then
                  echo "FATAL: Database auth failed (P1000)." >&2; exit 1
                fi
                if echo "$MIGRATE_OUTPUT" | grep -q P3005; then
                  echo "P3005 — baselining..."
                  mkdir -p prisma/migrations/0_init
                  npx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > prisma/migrations/0_init/migration.sql
                  npx prisma migrate resolve --applied 0_init
                  npx prisma migrate deploy
                  MIGRATION_DONE=1
                  break
                fi
                echo "Waiting for database... ($i/30)"
                sleep 2
              done
              if [ "$MIGRATION_DONE" != "1" ]; then
                echo "FATAL: Migration failed after 30 retries." >&2
                exit 1
              fi
            '

      # ── Step 3/4: Build ALL services in parallel via BuildKit ─
      - name: 3/4 Build — all services in parallel (backend + frontend + agents)
        uses: appleboy/ssh-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        with:
          host: ${{ secrets.TEST_SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY_TESTING }}
          envs: GITHUB_TOKEN,GITHUB_REPOSITORY,GITHUB_REPOSITORY_OWNER
          command_timeout: 1240m
          script: |
            set -e
            cd /root/ag_extension_decision_support/ag-extension-dashboard
            CLEAN_REBUILD="${{ github.event.inputs.force_clean_rebuild == 'true' && '--no-cache' || '' }}"

            if [ -n "$CLEAN_REBUILD" ]; then
              echo "🧹 Clean rebuild forced — building without cache..."
              docker buildx bake -f docker-bake.hcl backend frontend agent-zero crew-ai
            else
              echo "🔐 Authenticating to GHCR for remote Docker layer cache..."
              echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_REPOSITORY_OWNER" --password-stdin 2>/dev/null
              echo "📦 Building with remote cache (GHCR)..."
              docker buildx create --use --driver docker-container --name remote-builder 2>/dev/null || docker buildx use remote-builder 2>/dev/null || true
              docker buildx bake -f docker-bake.hcl backend frontend agent-zero crew-ai
            fi

            echo "🚀 Starting all services..."
            docker compose -f docker-compose.yml -f docker-compose.agents.yml up -d --force-recreate --no-build backend frontend agent-zero crew-ai

      # ── Step 4/4: Cleanup ────────────────────────────────────
      - name: 4/4 Cleanup — disk usage report + prune
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.TEST_SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY_TESTING }}
          command_timeout: 5m
          script: |
            echo "💾 Docker disk usage before cleanup:"
            echo "  Overlay2 actual: $(du -sh /var/lib/docker/ 2>/dev/null | cut -f1)"
            docker system df
            echo ""
            echo "🧹 Pruning stale Docker images (unused + dangling, older than 24h)..."
            docker image prune -a -f --filter "until=24h"
            echo "🧹 Pruning BuildKit build cache..."
            docker builder prune -f --filter "until=24h" 2>/dev/null || true
            echo ""
            echo "💾 Docker disk usage after cleanup:"
            echo "  Overlay2 actual: $(du -sh /var/lib/docker/ 2>/dev/null | cut -f1)"
            docker system df

      # ── Step 5/5: Health Check — verify services are up ─────────────────────
      - name: 5/5 Health Check — verify services
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.TEST_SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY_TESTING }}
          command_timeout: 3m
          script: |
            echo "⏳ Waiting for backend to become healthy..."
            for i in $(seq 1 15); do
              if curl -sSf http://localhost:7500/health > /dev/null 2>&1; then
                echo "✅ Backend is healthy!"
                exit 0
              fi
              echo "  Attempt $i/15 — waiting 5s..."
              sleep 5
            done
            echo "❌ Backend health check failed after 15 attempts"
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" || true
            exit 1

  sync-master:
    needs: deploy-testing
    if: github.ref == 'refs/heads/stage' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
      - name: Fast-forward merge stage into master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git checkout master || git checkout -b master
          git merge --ff-only origin/stage || echo "No fast-forward possible"
          git push origin master

  # 3. Deploy to Production (New Server) — 4 timed steps, parallel builds via BuildKit
  deploy-production:
    needs: ci-checks
    if: (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.base_ref == 'master') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      # ── Step 1/4: Git sync & .env with GitHub Secrets (fast) ─
      - name: 1/4 Sync — git checkout + .env
        uses: appleboy/ssh-action@master
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY_PRODUCTION }}
          envs: JWT_SECRET,OPENAI_API_KEY,ANTHROPIC_API_KEY,ACME_EMAIL
          command_timeout: 3m
          script: |
            set -e
            if [ ! -d "/root/ag_extension_decision_support" ]; then
              cd /root && git clone https://github.com/${{ github.repository }}.git
            fi
            cd /root/ag_extension_decision_support/ag-extension-dashboard
            git fetch origin master
            git checkout master
            git reset --hard origin/master

            if [ ! -f ".env" ]; then
              cp .env.example .env
              for var in JWT_SECRET OPENAI_API_KEY ANTHROPIC_API_KEY ACME_EMAIL; do
                val="${!var}"
                if [ -n "$val" ]; then
                  printf '%s=%s\n' "$var" "$val" >> .env
                fi
              done
              echo ".env created from .env.example with GitHub Secrets"
            else
              echo ".env already exists — skipping creation"
            fi

      # ── Step 2/4: Infrastructure & migrations (moderate) ─────
      - name: 2/4 Infra — database + migrations
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY_PRODUCTION }}
          command_timeout: 20m
          script: |
            set -e
            cd /root/ag_extension_decision_support/ag-extension-dashboard
            COMPOSE_FILES="-f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.agents.yml"

            DB_UP=$(docker ps --filter "name=ag-dashboard-db" --filter "status=running" -q)
            REDIS_UP=$(docker ps --filter "name=ag-dashboard-redis" --filter "status=running" -q)

            if [ -z "$DB_UP" ] || [ -z "$REDIS_UP" ]; then
              echo "📦 Databases down — building infrastructure..."
              docker compose $COMPOSE_FILES up -d --build app-db redis
            fi

            echo "🗄️ Running database migrations..."
            docker compose $COMPOSE_FILES run --rm backend bash -c '
              MIGRATION_DONE=0
              for i in {1..30}; do
                MIGRATE_OUTPUT=$(npx prisma migrate deploy 2>&1) && { echo "Migrations up to date."; MIGRATION_DONE=1; break; }
                if echo "$MIGRATE_OUTPUT" | grep -q P1000; then
                  echo "FATAL: Database auth failed (P1000)." >&2; exit 1
                fi
                if echo "$MIGRATE_OUTPUT" | grep -q P3005; then
                  echo "P3005 — baselining..."
                  mkdir -p prisma/migrations/0_init
                  npx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > prisma/migrations/0_init/migration.sql
                  npx prisma migrate resolve --applied 0_init
                  npx prisma migrate deploy
                  MIGRATION_DONE=1
                  break
                fi
                echo "Waiting for database... ($i/30)"
                sleep 2
              done
              if [ "$MIGRATION_DONE" != "1" ]; then
                echo "FATAL: Migration failed after 30 retries." >&2
                exit 1
              fi
            '

      # ── Step 3/4: Build ALL services in parallel via BuildKit ─
      - name: 3/4 Build — all services in parallel (backend + frontend + agents)
        uses: appleboy/ssh-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY_PRODUCTION }}
          envs: GITHUB_TOKEN,GITHUB_REPOSITORY,GITHUB_REPOSITORY_OWNER
          command_timeout: 1240m
          script: |
            set -e
            cd /root/ag_extension_decision_support/ag-extension-dashboard
            CLEAN_REBUILD="${{ github.event.inputs.force_clean_rebuild == 'true' && '--no-cache' || '' }}"

            if [ -n "$CLEAN_REBUILD" ]; then
              echo "🧹 Clean rebuild forced — building without cache..."
              docker buildx bake -f docker-bake.hcl backend frontend agent-zero crew-ai
            else
              echo "🔐 Authenticating to GHCR for remote Docker layer cache..."
              echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_REPOSITORY_OWNER" --password-stdin 2>/dev/null
              echo "📦 Building with remote cache (GHCR)..."
              docker buildx create --use --driver docker-container --name remote-builder 2>/dev/null || docker buildx use remote-builder 2>/dev/null || true
              docker buildx bake -f docker-bake.hcl backend frontend agent-zero crew-ai
            fi

            echo "🚀 Starting all services..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.agents.yml up -d --force-recreate --no-build backend frontend agent-zero crew-ai

      # ── Step 4/4: Cleanup ────────────────────────────────────
      - name: 4/4 Cleanup — disk usage report + prune
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY_PRODUCTION }}
          command_timeout: 5m
          script: |
            echo "💾 Docker disk usage before cleanup:"
            echo "  Overlay2 actual: $(du -sh /var/lib/docker/ 2>/dev/null | cut -f1)"
            docker system df
            echo ""
            echo "🧹 Pruning stale Docker images (unused + dangling, older than 24h)..."
            docker image prune -a -f --filter "until=24h"
            echo "🧹 Pruning BuildKit build cache..."
            docker builder prune -f --filter "until=24h" 2>/dev/null || true
            echo ""
            echo "💾 Docker disk usage after cleanup:"
            echo "  Overlay2 actual: $(du -sh /var/lib/docker/ 2>/dev/null | cut -f1)"
            docker system df

      # ── Step 5/5: SSL + Health Check ──────────────────────────
      - name: 5/5 SSL & Health Check — verify certificate and services
        uses: appleboy/ssh-action@master
        env:
          ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY_PRODUCTION }}
          envs: ACME_EMAIL
          command_timeout: 5m
          script: |
            cd /root/ag_extension_decision_support/ag-extension-dashboard

            # Ensure ACME_EMAIL is in .env
            if ! grep -q "ACME_EMAIL" .env 2>/dev/null; then
              echo "ACME_EMAIL=${ACME_EMAIL:-admin@gpexts.com}" >> .env
              echo "✅ Added ACME_EMAIL to .env"
            fi

            echo "⏳ Waiting for services to stabilize..."
            sleep 15

            echo ""
            echo "🔒 Checking SSL certificate..."
            CERT_SUBJECT=$(echo | openssl s_client -connect www.gpexts.com:443 -servername www.gpexts.com 2>/dev/null | openssl x509 -noout -subject 2>/dev/null || echo "UNKNOWN")
            echo "  Certificate: $CERT_SUBJECT"

            if echo "$CERT_SUBJECT" | grep -qi "TRAEFIK DEFAULT CERT"; then
              echo "⚠️ Traefik serving default cert — triggering ACME renewal..."
              COMPOSE_FILES="-f docker-compose.yml -f docker-compose.prod.yml"
              docker compose $COMPOSE_FILES exec -T traefik rm -f /letsencrypt/acme.json 2>/dev/null || true
              VOLUME_PATH=$(docker volume inspect ag-extension-dashboard_traefik_letsencrypt -f '{{.Mountpoint}}' 2>/dev/null || echo "")
              if [ -n "$VOLUME_PATH" ] && [ -f "$VOLUME_PATH/acme.json" ]; then
                rm -f "$VOLUME_PATH/acme.json"
              fi
              docker compose $COMPOSE_FILES restart traefik
              echo "  Traefik restarted — cert should be issued within 60s"
            elif echo "$CERT_SUBJECT" | grep -qi "gpexts"; then
              echo "✅ Valid SSL certificate detected"
            fi

            echo ""
            echo "🏥 Checking backend health..."
            for i in $(seq 1 10); do
              if curl -sSfk https://localhost/health > /dev/null 2>&1 || curl -sSf http://localhost:7500/health > /dev/null 2>&1; then
                echo "✅ Backend is healthy!"
                exit 0
              fi
              echo "  Attempt $i/10 — waiting 5s..."
              sleep 5
            done
            echo "⚠️ Backend health check did not pass — check manually"
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" || true

