name: AG-Extension Multi-Server Deployment

on:
  push:
    branches:
      - stage
      - 'feature/*'
  pull_request:
    branches:
      - master
    types: [closed]
  workflow_dispatch:

jobs:
  # 1. CI Checks (Runs for all triggers)
  ci-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            ag-extension-dashboard/src/frontend/package-lock.json
            ag-extension-dashboard/src/backend/package-lock.json

      - name: Install Dependencies
        run: |
          cd ag-extension-dashboard
          npm install

      - name: Lint, Build & Test Frontend (with coverage)
        run: |
          cd ag-extension-dashboard/src/frontend
          npm ci
          npm run lint
          npm run build
          npm run test:coverage

      - name: Lint, Build & Test Backend
        run: |
          cd ag-extension-dashboard/src/backend
          npm ci
          npx prisma generate
          npm run lint
          npm run build
          npm test -- --forceExit

  # 2. Deploy to Testing (Old Server)
  deploy-testing:
    needs: ci-checks
    if: github.event_name == 'push' && (github.ref == 'refs/heads/stage' || startsWith(github.ref, 'refs/heads/feature/'))
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Old Server (Testing)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.TEST_SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY_TESTING }}
          command_timeout: 60m
          script: |
            if [ ! -d "/root/ag_extension_decision_support" ]; then
              echo "🚀 Project directory missing. Cloning repository..."
              cd /root
              git clone https://github.com/${{ github.repository }}.git
            fi
            
            cd /root/ag_extension_decision_support/ag-extension-dashboard
            git fetch origin
            
            # Ensure branch exists and is checked out
            if git show-ref --verify --quiet refs/heads/${{ github.ref_name }}; then
              git checkout ${{ github.ref_name }}
            else
              git checkout -b ${{ github.ref_name }} origin/${{ github.ref_name }}
            fi
            
            # Force sync — discard any local modifications that would block the deploy
            git reset --hard origin/${{ github.ref_name }}

            # ── Ensure .env file exists ──────────────────────────
            if [ ! -f ".env" ]; then
              echo ".env not found — creating from .env.example..."
              cp .env.example .env
              echo ".env created from .env.example (edit secrets manually or set GitHub Secrets)"
            else
              echo ".env already exists — skipping creation"
            fi

            # Check if databases are UP
            DB_UP=$(docker ps --filter "name=ag-dashboard-db" --filter "status=running" -q)
            REDIS_UP=$(docker ps --filter "name=ag-dashboard-redis" --filter "status=running" -q)
            
            if [ -z "$DB_UP" ] || [ -z "$REDIS_UP" ]; then
              echo "Databases DOWN. Building infrastructure, running migrations, then deploying app services..."
              # Build/start infrastructure first (slow builds, avoid CPU contention)
              docker compose -f docker-compose.yml -f docker-compose.agents.yml up -d --build app-db redis
              # Wait for database and run migrations before building app services
              docker compose -f docker-compose.yml -f docker-compose.agents.yml run --rm backend bash -c "
                # Wait for database and run migrations (up to 60s)
                for i in {1..30}; do
                  MIGRATE_OUTPUT=\$(npx prisma migrate deploy 2>&1) && { echo 'Migrations up to date.'; break; }
                  if echo \"\$MIGRATE_OUTPUT\" | grep -q P1000; then
                    echo 'FATAL: Database authentication failed (P1000). Check DATABASE_USER/DATABASE_PASSWORD in .env.' >&2
                    exit 1
                  fi
                  if echo \"\$MIGRATE_OUTPUT\" | grep -q P3005; then
                    echo 'P3005 detected — baselining existing database...';
                    mkdir -p prisma/migrations/0_init;
                    npx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > prisma/migrations/0_init/migration.sql;
                    npx prisma migrate resolve --applied 0_init;
                    echo 'Baseline applied. Running migrate deploy...';
                    npx prisma migrate deploy;
                    break
                  fi
                  echo 'Waiting for database... ('\$i'/30)'
                  sleep 2
                done
                echo 'FATAL: Database migration failed after 30 retries.' >&2
                exit 1
              "
              # Then build app services with no-cache to force rebuild
              docker compose -f docker-compose.yml -f docker-compose.agents.yml build --no-cache backend frontend agent-zero crew-ai
              docker compose -f docker-compose.yml -f docker-compose.agents.yml up -d --force-recreate backend frontend agent-zero crew-ai
            else
              echo "Databases UP. Waiting for database readiness then running migrations..."
              docker compose -f docker-compose.yml -f docker-compose.agents.yml run --rm backend bash -c "
                # Wait for database and run migrations (up to 60s)
                for i in {1..30}; do
                  MIGRATE_OUTPUT=\$(npx prisma migrate deploy 2>&1) && { echo 'Migrations up to date.'; break; }
                  if echo \"\$MIGRATE_OUTPUT\" | grep -q P1000; then
                    echo 'FATAL: Database authentication failed (P1000). Check DATABASE_USER/DATABASE_PASSWORD in .env.' >&2
                    exit 1
                  fi
                  if echo \"\$MIGRATE_OUTPUT\" | grep -q P3005; then
                    echo 'P3005 detected — baselining existing database...';
                    mkdir -p prisma/migrations/0_init;
                    npx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > prisma/migrations/0_init/migration.sql;
                    npx prisma migrate resolve --applied 0_init;
                    echo 'Baseline applied. Running migrate deploy...';
                    npx prisma migrate deploy;
                    break
                  fi
                  echo 'Waiting for database... ('\$i'/30)'
                  sleep 2
                done
                echo 'FATAL: Database migration failed after 30 retries.' >&2
                exit 1
              "
              # Force clean rebuild — no-cache prevents Docker from reusing stale layers
              docker compose -f docker-compose.yml -f docker-compose.agents.yml build --no-cache backend frontend agent-zero crew-ai
              docker compose -f docker-compose.yml -f docker-compose.agents.yml up -d --force-recreate backend frontend agent-zero crew-ai
            fi
            docker image prune -f

  # 3. Deploy to Production (New Server)
  deploy-production:
    needs: ci-checks
    if: (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.base_ref == 'master') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Production Server
        uses: appleboy/ssh-action@master
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY_PRODUCTION }}
          envs: JWT_SECRET,OPENAI_API_KEY,ANTHROPIC_API_KEY,ACME_EMAIL
          command_timeout: 60m
          script: |
            if [ ! -d "/root/ag_extension_decision_support" ]; then
              echo "Project directory missing. Cloning repository..."
              cd /root
              git clone https://github.com/${{ github.repository }}.git
            fi

            cd /root/ag_extension_decision_support/ag-extension-dashboard
            git fetch origin master
            git checkout master
            # Force sync — discard any local modifications that would block the deploy
            git reset --hard origin/master

            # ── Ensure .env file exists ──────────────────────────
            if [ ! -f ".env" ]; then
              echo ".env not found — creating from .env.example with GitHub Secrets..."
              cp .env.example .env
              # Override critical secrets — append at end of file (Docker Compose uses last-value-wins)
              for var in JWT_SECRET OPENAI_API_KEY ANTHROPIC_API_KEY ACME_EMAIL; do
                val="${!var}"
                if [ -n "$val" ]; then
                  printf '%s=%s\n' "$var" "$val" >> .env
                  echo "  ✅ $var set from GitHub Secret"
                fi
              done
              echo ".env created successfully"
            else
              echo ".env already exists — skipping creation"
            fi

            echo "Checking database and redis status..."
            DB_UP=$(docker ps --filter "name=ag-dashboard-db" --filter "status=running" -q)
            REDIS_UP=$(docker ps --filter "name=ag-dashboard-redis" --filter "status=running" -q)

            if [ -z "$DB_UP" ] || [ -z "$REDIS_UP" ]; then
              echo "Databases DOWN. Building infrastructure, running migrations, then deploying app services..."
              # Build/start infrastructure first (slow builds, avoid CPU contention)
              docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.agents.yml up -d --build app-db redis
              # Wait for database and run migrations before building app services
              docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.agents.yml run --rm backend bash -c "
                # Wait for database and run migrations (up to 60s)
                for i in {1..30}; do
                  MIGRATE_OUTPUT=\$(npx prisma migrate deploy 2>&1) && { echo 'Migrations up to date.'; break; }
                  if echo \"\$MIGRATE_OUTPUT\" | grep -q P1000; then
                    echo 'FATAL: Database authentication failed (P1000). Check DATABASE_USER/DATABASE_PASSWORD in .env.' >&2
                    exit 1
                  fi
                  if echo \"\$MIGRATE_OUTPUT\" | grep -q P3005; then
                    echo 'P3005 detected — baselining existing database...';
                    mkdir -p prisma/migrations/0_init;
                    npx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > prisma/migrations/0_init/migration.sql;
                    npx prisma migrate resolve --applied 0_init;
                    echo 'Baseline applied. Running migrate deploy...';
                    npx prisma migrate deploy;
                    break
                  fi
                  echo 'Waiting for database... ('\$i'/30)'
                  sleep 2
                done
                echo 'FATAL: Database migration failed after 30 retries.' >&2
                exit 1
              "
              # Then build app services with no-cache to force rebuild
              docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.agents.yml build --no-cache backend frontend agent-zero crew-ai
              docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.agents.yml up -d --force-recreate backend frontend agent-zero crew-ai
            else
              echo "Databases UP. Waiting for database readiness then running migrations..."
              docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.agents.yml run --rm backend bash -c "
                # Wait for database and run migrations (up to 60s)
                for i in {1..30}; do
                  MIGRATE_OUTPUT=\$(npx prisma migrate deploy 2>&1) && { echo 'Migrations up to date.'; break; }
                  if echo \"\$MIGRATE_OUTPUT\" | grep -q P1000; then
                    echo 'FATAL: Database authentication failed (P1000). Check DATABASE_USER/DATABASE_PASSWORD in .env.' >&2
                    exit 1
                  fi
                  if echo \"\$MIGRATE_OUTPUT\" | grep -q P3005; then
                    echo 'P3005 detected — baselining existing database...';
                    mkdir -p prisma/migrations/0_init;
                    npx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > prisma/migrations/0_init/migration.sql;
                    npx prisma migrate resolve --applied 0_init;
                    echo 'Baseline applied. Running migrate deploy...';
                    npx prisma migrate deploy;
                    break
                  fi
                  echo 'Waiting for database... ('\$i'/30)'
                  sleep 2
                done
                echo 'FATAL: Database migration failed after 30 retries.' >&2
                exit 1
              "
              # Force clean rebuild — no-cache prevents Docker from reusing stale layers
              docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.agents.yml build --no-cache backend frontend agent-zero crew-ai
              docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.agents.yml up -d --force-recreate backend frontend agent-zero crew-ai
            fi
            docker image prune -f
