name: Modern web guidance

# Guards against legacy-platform drift: the scanner flags patterns we have
# already modernised elsewhere (innerHTML sinks, hand-rolled AbortController
# timeouts, [...x].sort(), IME-unsafe Enter handlers, missing autocomplete).
# The suite currently has zero findings, so any finding is a regression.

on:
  pull_request:
  push:
    branches: [stage, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-scan:
    name: Legacy platform scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Scan for legacy web platform patterns
        run: |
          set -o pipefail
          # Structured output (same pinned scanner version) so the verdict never
          # depends on how the human-readable report is indented.
          npx --yes modern-web-guidance@1.0.1 legacy-scan --json > "$RUNNER_TEMP/scan.json"

      - name: Fail on new findings
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            let report;
            try {
              report = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            } catch (err) {
              console.log("::error::Could not parse the scan report — the scanner failed or its output format changed: " + err.message);
              process.exit(1);
            }
            const total = report.totalFindings;
            if (!Number.isInteger(total) || total < 0) {
              console.log("::error::Scan report has no valid totalFindings field (got " + JSON.stringify(total) + ").");
              process.exit(1);
            }
            if (total > 0) {
              for (const guide of report.guides || []) console.log(JSON.stringify(guide, null, 2));
              console.log("::error::" + total + " modernization finding(s) detected. Details above.");
              process.exit(1);
            }
            console.log("No modernization findings (" + (report.activeGuideCount ?? "?") + " guides checked).");
          ' "$RUNNER_TEMP/scan.json"
