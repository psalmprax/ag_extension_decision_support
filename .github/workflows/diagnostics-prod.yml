name: Run Production Diagnostics

on:
  workflow_dispatch:
    inputs:
      discover_models:
        description: Discover and test up to three lightweight available models
        type: boolean
        default: false
      use_verified_model:
        description: Switch production to verified gemini-3.1-flash-lite after a successful live probe
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: diagnostics-prod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnose:
    name: Run Diagnostics on Production Server
    # Touches the production host: require maintainer approval via the
    # production environment, matching reset-admin-prod.yml.
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Live AIHubMix request and response (no fallback)
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5 (pinned to commit SHA)
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY_PRODUCTION }}
          command_timeout: 4m
          script: |
            set -eu
            docker exec -i -e DISCOVER_MODELS=${{ inputs.discover_models && 'true' || 'false' }} -e VERIFY_MODEL=${{ inputs.use_verified_model && 'gemini-3.1-flash-lite' || '' }} ag-dashboard-backend node --input-type=module <<'NODE'
            const startedAt = Date.now();
            const key = process.env.AIHUBMIX_API_KEY?.trim();
            const configuredModel = process.env.VERIFY_MODEL || process.env.AI_PRIMARY_MODEL || 'gemini-3.1-flash-lite';
            const prompt = 'Reply with a short sentence confirming you can respond.';
            const secrets = [key, key?.replace(/^Bearer\s+/i, ''), process.env.AIHUBMIX_ACCESS_KEY].filter(Boolean);
            function safe(value) {
              let text = String(value);
              for (const secret of secrets) text = text.split(secret).join('[REDACTED]');
              return text.replace(/[\x00-\x1f\x7f]/g, ' ').slice(0, 1000);
            }
            function fail(message) {
              console.error(`\x1b[31mFAIL: ${safe(message)} (${Date.now() - startedAt} ms)\x1b[0m`);
              process.exitCode = 1;
            }
            if (!key) {
              fail('AIHUBMIX_API_KEY is missing; a real API key is required. No account token is provisioned.');
            } else {
              console.log(`Configured model: ${safe(configuredModel)}`);
              console.log(`Prompt: ${prompt}`);
              try {
                let models = [configuredModel];
                if (process.env.DISCOVER_MODELS === 'true') {
                  const catalog = await fetch('https://aihubmix.com/v1/models', {
                    headers: { Authorization: /^Bearer\s+/i.test(key) ? key : `Bearer ${key}` },
                    signal: AbortSignal.timeout(15000),
                  });
                  console.log(`Model catalog HTTP status: ${catalog.status}`);
                  if (!catalog.ok) throw new Error(`Model catalog HTTP ${catalog.status}`);
                  const listing = await catalog.json();
                  if (!Array.isArray(listing.data)) throw new Error('Invalid model catalog');
                  const available = listing.data.map(item => item.id).filter(id => typeof id === 'string');
                  const preferred = ['gemini-3.1-flash-lite', 'gemini-3-flash-preview', 'gemini-2.5-flash-lite', 'gpt-4.1-mini', 'gpt-4o-mini'];
                  const lightweight = available.filter(id =>
                    /^(gemini-[\w.-]*flash[\w.-]*|gpt-[\w.-]*mini)$/.test(id)
                    && !/image|audio|tts|realtime|embedding|retired/i.test(id)
                  ).sort();
                  models = [...new Set([...preferred.filter(id => available.includes(id)), ...lightweight])].slice(0, 3);
                  console.log(`Available lightweight models: ${safe(JSON.stringify(lightweight))}`);
                  if (!models.length) throw new Error('No suitable lightweight models found in catalog');
                  console.log(`Selected test models: ${safe(JSON.stringify(models))}`);
                }
                for (const model of models) {
                  const modelStartedAt = Date.now();
                  console.log(`Model: ${safe(model)}`);
                  try {
                const response = await fetch('https://aihubmix.com/v1/chat/completions', {
                  method: 'POST',
                  headers: {
                    Authorization: /^Bearer\s+/i.test(key) ? key : `Bearer ${key}`,
                    'Content-Type': 'application/json',
                  },
                  body: JSON.stringify({
                    model,
                    messages: [{ role: 'user', content: prompt }],
                    max_tokens: 128,
                    stream: false,
                  }),
                  signal: AbortSignal.timeout(45000),
                });
                console.log(`HTTP status: ${response.status}`);
                if (!response.ok) {
                  console.log(`Error response: ${safe(await response.text())}`);
                  fail(`AIHubMix returned HTTP ${response.status}; no fallback was attempted`);
                } else {
                  const data = await response.json();
                  const text = data.choices?.[0]?.message?.content;
                  if (typeof text !== 'string' || !text.trim()) {
                    fail('AIHubMix returned no nonempty assistant response');
                  } else {
                    console.log(`Response: ${safe(text.trim())}`);
                    console.log(`Returned model: ${safe(data.model || model)}`);
                    console.log(`PASS: AIHubMix responded in ${Date.now() - modelStartedAt} ms (no fallback)`);
                  }
                }
                  } catch (error) {
                fail(error.name === 'TimeoutError'
                  ? 'AIHubMix did not respond within 45 seconds'
                  : `AIHubMix request failed (${error.name}); check network connectivity or response format`);
                  }
                }
              } catch (error) {
                fail(error.message);
              }
            }
            NODE
      - name: Report live AIHubMix failure
        if: failure()
        run: |
          echo "::error::Live AIHubMix request failed. See the request/response step for HTTP status or timeout."
      - name: Apply verified production model
        if: success() && inputs.use_verified_model && !inputs.discover_models
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5 (pinned to commit SHA)
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY_PRODUCTION }}
          command_timeout: 5m
          script: |
            set -eu
            cd /root/ag_extension_decision_support/ag-extension-dashboard
            backup=$(mktemp)
            chmod 600 "$backup"
            cp .env "$backup"
            compose() {
              docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.agents.yml "$@"
            }
            rollback() {
              cp "$backup" .env
              rm -f "$backup"
              compose up -d --no-deps --no-build --force-recreate backend
              echo "Model update failed; previous environment restored." >&2
            }
            trap rollback EXIT
            if grep -q '^AI_PRIMARY_MODEL=' .env; then
              sed -i 's/^AI_PRIMARY_MODEL=.*/AI_PRIMARY_MODEL=gemini-3.1-flash-lite/' .env
            else
              printf '\nAI_PRIMARY_MODEL=gemini-3.1-flash-lite\n' >> .env
            fi
            compose up -d --no-deps --no-build --force-recreate backend
            ready=false
            for attempt in $(seq 1 24); do
              if docker exec ag-dashboard-backend node -e \
                'if(process.env.AI_PRIMARY_MODEL!=="gemini-3.1-flash-lite")process.exit(1);fetch("http://localhost:3001/health/ready").then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))'; then
                ready=true
                break
              fi
              sleep 5
            done
            test "$ready" = true
            trap - EXIT
            rm -f "$backup"
            echo "Production backend ready with AI_PRIMARY_MODEL=gemini-3.1-flash-lite"
      - name: SSH and run diagnostics
        if: always()
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5 (pinned to commit SHA)
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY_PRODUCTION }}
          command_timeout: 15m
          script: |
            set -e
            cd /root/ag_extension_decision_support/ag-extension-dashboard

            echo "============================================="
            echo "🐳 Docker Containers Status"
            echo "============================================="
            docker ps -a --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

            echo ""
            echo "============================================="
            echo "🌐 Docker Networks"
            echo "============================================="
            docker network ls

            echo ""
            echo "============================================="
            echo "🔍 Network ag-network Inspection"
            echo "============================================="
            docker network inspect ag-network

            echo ""
            echo "============================================="
            echo "📋 Backend Container Logs (Last 50 lines)"
            echo "============================================="
            docker logs --tail=50 ag-dashboard-backend || true

            echo ""
            echo "============================================="
            echo "📋 Agent Zero Logs (Last 50 lines)"
            echo "============================================="
            docker logs --tail=50 ag-agent-zero || true

            echo ""
            echo "============================================="
            echo "📋 Crew AI Logs (Last 50 lines)"
            echo "============================================="
            docker logs --tail=50 ag-crew-ai || true

            echo ""
            echo "============================================="
            echo "⚡ Connectivity Tests from Backend"
            echo "============================================="
            echo "1. Resolving ag-agent-zero from backend:"
            docker exec ag-dashboard-backend nslookup ag-agent-zero || docker exec ag-dashboard-backend ping -c 1 ag-agent-zero || echo "❌ Resolution failed"

            echo ""
            echo "2. Resolving ag-crew-ai from backend:"
            docker exec ag-dashboard-backend nslookup ag-crew-ai || docker exec ag-dashboard-backend ping -c 1 ag-crew-ai || echo "❌ Resolution failed"

            echo ""
            echo "3. Querying agent-zero health from backend:"
            docker exec ag-dashboard-backend curl -iv http://ag-agent-zero:8000/health || echo "❌ Curl to agent-zero failed"

            echo ""
            echo "4. Querying crew-ai health from backend:"
            docker exec ag-dashboard-backend curl -iv http://ag-crew-ai:8001/health || echo "❌ Curl to crew-ai failed"

            echo ""
            echo "5. Querying agent-zero health from host:"
            curl -iv http://127.0.0.1:7504/health || echo "❌ Host curl to agent-zero failed"

            echo ""
            echo "6. Querying crew-ai health from host:"
            curl -iv http://127.0.0.1:7505/health || echo "❌ Host curl to crew-ai failed"

            echo ""
            echo "============================================="
            echo "🔑 Environment Checks (.env and container envs)"
            echo "============================================="
            echo "Checking .env file keys on host:"
            if [ -f "/root/ag_extension_decision_support/ag-extension-dashboard/.env" ]; then
              echo "✅ .env file exists"
              grep -E "^[A-Z0-9_]+=" /root/ag_extension_decision_support/ag-extension-dashboard/.env | while read -r line; do
                key=$(echo "$line" | cut -d= -f1)
                val=$(echo "$line" | cut -d= -f2-)
                if [ -z "$val" ]; then
                  echo "  $key=EMPTY"
                else
                  echo "  $key=SET (length: ${#val})"
                fi
              done
            else
              echo "❌ .env file does not exist"
            fi

            echo ""
            echo "Checking env vars inside ag-dashboard-backend:"
            docker exec ag-dashboard-backend env | grep -E "OPENAI|ANTHROPIC|JWT|VAPID" | while read -r line; do
              key=$(echo "$line" | cut -d= -f1)
              val=$(echo "$line" | cut -d= -f2-)
              echo "  $key=SET (length: ${#val})"
            done || echo "❌ Could not read backend env"

            echo ""
            echo "Checking env vars inside ag-agent-zero:"
            docker exec ag-agent-zero env | grep -E "OPENAI|ANTHROPIC|JWT|VAPID" | while read -r line; do
              key=$(echo "$line" | cut -d= -f1)
              val=$(echo "$line" | cut -d= -f2-)
              echo "  $key=SET (length: ${#val})"
            done || echo "❌ Could not read agent-zero env"

            echo ""
            echo "Checking env vars inside ag-crew-ai:"
            docker exec ag-crew-ai env | grep -E "OPENAI|ANTHROPIC|JWT|VAPID" | while read -r line; do
              key=$(echo "$line" | cut -d= -f1)
              val=$(echo "$line" | cut -d= -f2-)
              echo "  $key=SET (length: ${#val})"
            done || echo "❌ Could not read crew-ai env"
