name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # Frontend checks
  frontend:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ag-extension-dashboard/src/frontend/package-lock.json
      
      - name: Install frontend dependencies
        run: |
          cd ag-extension-dashboard/src/frontend
          npm ci
      
      - name: Lint frontend
        run: |
          cd ag-extension-dashboard/src/frontend
          npm run lint
      
      - name: Type check frontend
        run: |
          cd ag-extension-dashboard/src/frontend
          npx tsc --noEmit
      
      - name: Build frontend
        run: |
          cd ag-extension-dashboard/src/frontend
          npm run build
      
      - name: Run frontend tests
        run: |
          cd ag-extension-dashboard/src/frontend
          npm run test -- --run

  # Backend checks
  backend:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: psalmprax
          POSTGRES_PASSWORD: password
          POSTGRES_DB: ag_extension
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ag-extension-dashboard/src/backend/package-lock.json
      
      - name: Install backend dependencies
        run: |
          cd ag-extension-dashboard/src/backend
          npm ci

      - name: Generate Prisma client
        run: |
          cd ag-extension-dashboard/src/backend
          npx prisma generate

      - name: Push database schema
        run: |
          cd ag-extension-dashboard/src/backend
          npx prisma db push --skip-generate
        env:
          DATABASE_URL: postgres://psalmprax:password@localhost:5432/ag_extension

      - name: Lint backend
        run: |
          cd ag-extension-dashboard/src/backend
          npm run lint
      
      - name: Type check backend
        run: |
          cd ag-extension-dashboard/src/backend
          npx tsc --noEmit
      
      - name: Run backend tests
        run: |
          cd ag-extension-dashboard/src/backend
          npm run test
        env:
          DATABASE_URL: postgres://psalmprax:password@localhost:5432/ag_extension
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test

  # Security audit
  security:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Audit frontend dependencies
        run: |
          cd ag-extension-dashboard/src/frontend
          npm audit --audit-level=high
      
      - name: Audit backend dependencies
        run: |
          cd ag-extension-dashboard/src/backend
          npm audit --audit-level=high

  # Build and deploy (only on main)
  deploy:
    needs: [frontend, backend, security]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Build and tag Docker image
        run: |
          echo "Docker build would happen here"
          # docker build -t ag-extension:${{ github.sha }} .
      
      - name: Deploy to production
        run: |
          echo "Deployment would happen here"
