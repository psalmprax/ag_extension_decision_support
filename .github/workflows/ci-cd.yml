name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # Frontend checks
  frontend:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ag-extension-dashboard/src/frontend/package-lock.json
      
      - name: Install frontend dependencies
        run: |
          cd ag-extension-dashboard/src/frontend
          npm ci
      
      - name: Lint frontend
        run: |
          cd ag-extension-dashboard/src/frontend
          npm run lint
      
      - name: Type check frontend
        run: |
          cd ag-extension-dashboard/src/frontend
          npx tsc --noEmit
      
      - name: Build frontend
        run: |
          cd ag-extension-dashboard/src/frontend
          npm run build
      
      - name: Check frontend bundle budget
        run: |
          cd ag-extension-dashboard/src/frontend
          npm run check:bundle

      - name: Run frontend tests
        run: |
          cd ag-extension-dashboard/src/frontend
          npm run test -- --run

      - name: Install Playwright browser
        run: |
          cd ag-extension-dashboard/src/frontend
          npx playwright install --with-deps chromium

      - name: Run release smoke tests
        run: |
          cd ag-extension-dashboard/src/frontend
          npm run test:e2e -- --grep @release

  # Backend checks
  backend:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: psalmprax
          POSTGRES_PASSWORD: password
          POSTGRES_DB: ag_extension
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ag-extension-dashboard/src/backend/package-lock.json
      
      - name: Install backend dependencies
        run: |
          cd ag-extension-dashboard/src/backend
          npm ci

      - name: Generate Prisma client
        run: |
          cd ag-extension-dashboard/src/backend
          npx prisma generate

      - name: Push database schema
        run: |
          cd ag-extension-dashboard/src/backend
          npx prisma db push --skip-generate
        env:
          DATABASE_URL: postgres://psalmprax:password@localhost:5432/ag_extension

      - name: Lint backend
        run: |
          cd ag-extension-dashboard/src/backend
          npm run lint
      
      - name: Type check backend
        run: |
          cd ag-extension-dashboard/src/backend
          npx tsc --noEmit
      
      - name: Run backend tests
        run: |
          cd ag-extension-dashboard/src/backend
          npm run test
        env:
          DATABASE_URL: postgres://psalmprax:password@localhost:5432/ag_extension
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test

  # Browser extension checks
  extension:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ag-extension-browser-ext/package-lock.json

      - name: Install extension dependencies
        run: |
          cd ag-extension-browser-ext
          npm ci

      - name: Type check extension
        run: |
          cd ag-extension-browser-ext
          npm run typecheck

      - name: Build extension
        run: |
          cd ag-extension-browser-ext
          npm run build

      - name: Verify extension artifact
        run: |
          cd ag-extension-browser-ext
          test -n "$(find .output -name manifest.json -print -quit)"

  # Security audit
  security:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Audit frontend dependencies
        run: |
          cd ag-extension-dashboard/src/frontend
          npm audit --audit-level=high
      
      - name: Audit backend dependencies
        run: |
          cd ag-extension-dashboard/src/backend
          npm audit --audit-level=high

  # Deploy is handled by deploy-all.yml workflow
