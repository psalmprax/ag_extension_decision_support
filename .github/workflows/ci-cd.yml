name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # Frontend checks
  frontend:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ag-extension-dashboard/src/frontend/package-lock.json
      
      - name: Install frontend dependencies
        run: |
          cd ag-extension-dashboard/src/frontend
          npm ci
      
      - name: Lint frontend
        run: |
          cd ag-extension-dashboard/src/frontend
          npm run lint

      - name: Validate locale translations
        run: |
          cd ag-extension-dashboard/src/frontend
          npm run validate-locales

      - name: Type check frontend
        run: |
          cd ag-extension-dashboard/src/frontend
          npx tsc --noEmit
      
      - name: Build frontend
        run: |
          cd ag-extension-dashboard/src/frontend
          npm run build
      
      - name: Check frontend bundle budget
        run: |
          cd ag-extension-dashboard/src/frontend
          npm run check:bundle

      - name: Run frontend tests
        run: |
          cd ag-extension-dashboard/src/frontend
          npm run test -- --run

      - name: Install Playwright browser
        run: |
          cd ag-extension-dashboard/src/frontend
          npx playwright install --with-deps chromium

      - name: Run Playwright e2e tests
        run: |
          cd ag-extension-dashboard/src/frontend
          npm run test:e2e

  # Backend checks
  backend:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: psalmprax
          POSTGRES_PASSWORD: password
          POSTGRES_DB: ag_extension
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ag-extension-dashboard/src/backend/package-lock.json
      
      - name: Install backend dependencies
        run: |
          cd ag-extension-dashboard/src/backend
          npm ci

      - name: Generate Prisma client
        run: |
          cd ag-extension-dashboard/src/backend
          npx prisma generate

      - name: Push database schema
        run: |
          cd ag-extension-dashboard/src/backend
          npx prisma db push --skip-generate
        env:
          DATABASE_URL: postgres://psalmprax:password@localhost:5432/ag_extension

      - name: Lint backend
        run: |
          cd ag-extension-dashboard/src/backend
          npm run lint
      
      - name: Type check backend
        run: |
          cd ag-extension-dashboard/src/backend
          npx tsc --noEmit
      
      - name: Run backend tests
        run: |
          cd ag-extension-dashboard/src/backend
          npm run test
        env:
          DATABASE_URL: postgres://psalmprax:password@localhost:5432/ag_extension
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test

  # Dead-code regression gate (fallow)
  fallow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install fallow (pinned)
        run: npm install --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Fallow dead-code regression gate
        run: npm run fallow:check

  # Browser extension checks
  extension:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ag-extension-browser-ext/package-lock.json

      - name: Install extension dependencies
        run: |
          cd ag-extension-browser-ext
          npm ci

      - name: Type check extension
        run: |
          cd ag-extension-browser-ext
          npm run typecheck

      - name: Build extension
        run: |
          cd ag-extension-browser-ext
          npm run build

      - name: Verify extension artifact
        run: |
          cd ag-extension-browser-ext
          test -n "$(find .output -name manifest.json -print -quit)"

  # Full-Spectrum Security & Compliance Audit
  security:
    name: Multi-Service Security & Vulnerability Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Scan for Secret Leaks
        run: |
          PATTERNS=(
            "-----BEGIN (RSA|EC|OPENSSH|DSA|PRIVATE) KEY-----"
            "AIza[0-9A-Za-z-_]{35}"
            "sk-[a-zA-Z0-9]{20,48}"
            "ghp_[a-zA-Z0-9]{36}"
          )
          for pattern in "${PATTERNS[@]}"; do
            MATCHES=$(grep -rnEI "$pattern" \
              --exclude-dir={node_modules,.git,dist,.output,.wxt,coverage,logs} \
              --exclude={"*.lock","package-lock.json","*.min.js",".env.example"} \
              . || true)
            if [ -n "$MATCHES" ]; then
              echo "::error::Secret pattern detected: $pattern"
              exit 1
            fi
          done

      - name: Audit frontend dependencies
        run: |
          cd ag-extension-dashboard/src/frontend
          npm audit --audit-level=high

      - name: Audit backend dependencies
        run: |
          cd ag-extension-dashboard/src/backend
          npm audit --audit-level=high

      - name: Audit shared package dependencies
        run: |
          cd ag-extension-shared
          npm audit --audit-level=high

      - name: Run Backend Security Tests
        run: |
          cd ag-extension-dashboard/src/backend
          npm ci
          npm test -- security
        env:
          NODE_ENV: test
          JWT_SECRET: ci_test_jwt_secret_32_characters_minimum!!
          CREDENTIAL_ENCRYPTION_KEY: ci_test_encryption_key_32_chars_minimum!

      - name: Run Frontend Security & Resilience Tests
        run: |
          cd ag-extension-dashboard/src/frontend
          npm run test -- src/__tests__/securityPolicy.test.ts src/__tests__/virtualizationAndThermal.test.ts src/__tests__/offlineConflictResolver.test.ts src/__tests__/remoteWipeAndEncryptedStorage.test.ts src/__tests__/chaosNetworkSimulation.test.ts

      - name: Run Browser Extension Security Check
        run: |
          cd ag-extension-browser-ext
          npm ci
          npm run test:security

      - name: Run Python Agent Security Tests
        run: |
          cd ag-extension-dashboard/src/agents
          pip install -r requirements.txt pytest httpx
          python -m pytest tests/test_security.py
        env:
          NODE_ENV: test
          JWT_SECRET: test_jwt_secret_32_characters_minimum!!
          CORS_ORIGINS: https://www.gpexts.com,http://localhost:7503

  # Deploy is handled by deploy-all.yml workflow

