name: Reset Admin / Seed Production Database

# PRODUCTION-MUTATING — requires a maintainer approval before it can run.
# The admin password is NEVER a workflow input: it lives in the PROD_ADMIN_NEW_PASSWORD
# repo secret and is written to the host's docker-compose .env by this workflow.
# Workflow inputs and inputs-derived env vars appear in run logs and the Actions API;
# secrets do not.

on:
  workflow_dispatch:
    inputs:
      admin_email:
        description: 'Admin Email to reset/verify'
        required: true
        default: 'admin@agridemo.com'

# Read-only token: the job only talks to the prod host via SSH.
permissions:
  contents: read

jobs:
  seed_and_reset:
    name: Seed Database & Reset Admin Credentials
    runs-on: ubuntu-latest
    # Approval gate: a maintainer must approve the run before the script
    # touches the production host. Requires repo setting
    # Settings → Environments → production → "Required reviewers".
    environment: production

    steps:
      - name: SSH into Production Server and Seed / Reset Admin
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5 (pinned to commit SHA)
        env:
          TARGET_EMAIL: ${{ github.event.inputs.admin_email }}
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY_PRODUCTION }}
          envs: TARGET_EMAIL
          command_timeout: 10m
          script: |
            set -e

            # Basic sanity check on the email input before it reaches the shell.
            case "$TARGET_EMAIL" in
              *[!A-Za-z0-9@._+-]*|'') echo "❌ Invalid admin email input"; exit 1 ;;
            esac

            cd /root/ag_extension_decision_support/ag-extension-dashboard
            COMPOSE_FILES="-f docker-compose.yml -f docker-compose.prod.yml"

            echo "============================================="
            echo "🌱 Running Prisma DB Seed on Production"
            echo "============================================="
            docker compose $COMPOSE_FILES exec -T backend npx prisma db seed

            echo "============================================="
            echo "🔐 Updating Admin Credentials directly"
            echo "============================================="
            # The new password arrives from the PROD_ADMIN_NEW_PASSWORD secret,
            # already written into the host .env by the operator (or a prior
            # step). We read it inside the host script and pass it to the
            # container over the compose env plumbing — never as a workflow
            # input, so it can never show up in run logs or the API.
            if ! grep -q '^PROD_ADMIN_NEW_PASSWORD=' .env; then
              echo "❌ PROD_ADMIN_NEW_PASSWORD not set in host .env — refusing to reset admin password."
              echo "   Add it to the host .env (one line, no echo, do not commit)."
              exit 1
            fi

            docker compose $COMPOSE_FILES exec -T backend node -e "
              const { PrismaClient } = require('@prisma/client');
              const bcrypt = require('bcryptjs');
              const prisma = new PrismaClient();
              async function run() {
                const email = process.env.TARGET_EMAIL || 'admin@agridemo.com';
                const pass = process.env.PROD_ADMIN_NEW_PASSWORD;
                if (!pass || pass.length < 12) {
                  console.error('❌ PROD_ADMIN_NEW_PASSWORD missing or shorter than 12 chars');
                  process.exit(1);
                }
                const passwordHash = await bcrypt.hash(pass, 10);
                const user = await prisma.user.upsert({
                  where: { email },
                  update: { passwordHash, role: 'admin' },
                  create: {
                    email,
                    passwordHash,
                    firstName: 'System',
                    lastName: 'Administrator',
                    role: 'admin',
                    region: 'Global'
                  }
                });
                console.log('✅ Admin user successfully verified/updated:', user.email, 'Role:', user.role);
                await prisma.\$disconnect();
              }
              run().catch(err => { console.error('❌ Error updating admin:', err); process.exit(1); });
            "

            echo "============================================="
            echo "🧹 Scrubbing password from host .env"
            echo "============================================="
            sed -i '/^PROD_ADMIN_NEW_PASSWORD=/d' .env

            echo "============================================="
            echo "✨ Verification Complete!"
            echo "============================================="
