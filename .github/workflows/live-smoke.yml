name: Live checks (stage smoke, retrieval eval, user stories)

# Three independent jobs; choose them with the `suite` input when dispatching.
#
# live-smoke (stage only) calls the real third-party services from the
# deployed stage backend, using
# the app's own compiled providers and the host's real configuration:
#   - one short text generation per configured AI provider,
#   - one embedding from the configured embeddings provider, checked against
#     the pgvector width,
#   - one PayPal sandbox payment, created but never executed (skipped unless
#     the API base is the sandbox).
# Unit tests mock all of these; this is what catches expired keys, retired
# models, quota exhaustion and config drift. Script: scripts/live-smoke.cjs.
#
# rag-eval (neither server) measures retrieval quality (hit@k, grounding,
# abstention) with the same real embedding and LLM providers, on a disposable
# pgvector database holding only the seed corpus, and fails below
# eval/rag-gates.json.
#
# user-stories (stage or production, by the `target` input; dispatch only)
# seeds the test population on that site and runs the Playwright user stories
# against it. See user-stories-live.yml.
#
# The workflow file name stays live-smoke.yml so existing dispatches and links
# keep working.

on:
  workflow_run:
    workflows: ["Deploy to Stage (auto on push)"]
    types: [completed]
  schedule:
    - cron: "41 4 * * 1"   # weekly, Monday 04:41 UTC: catches key/model expiry between deploys
  workflow_dispatch:
    inputs:
      suite:
        description: "Which checks to run. all = live-smoke + rag-eval (read-only). user-stories writes test data to the target's database and only runs when chosen by name."
        type: choice
        options: [all, live-smoke, rag-eval, user-stories]
        default: all
      target:
        description: Site for suite=user-stories (seeds the test population there and runs the Playwright user stories)
        type: choice
        options: [stage, production]
        default: stage

permissions:
  contents: read

concurrency:
  group: live-smoke
  cancel-in-progress: false

jobs:
  live-smoke:
    # After a stage deploy only when that deploy succeeded.
    if: >-
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') &&
      (github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'live-smoke')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/live-smoke.cjs
          sparse-checkout-cone-mode: false

      # The script travels with the workflow (not the host checkout), so a run
      # always uses the version from this ref. It is not secret.
      - name: Package the smoke script
        run: echo "LIVE_SMOKE_B64=$(base64 -w0 scripts/live-smoke.cjs)" >> "$GITHUB_ENV"

      - name: Run against the stage backend
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5 (pinned to commit SHA)
        with:
          host: ${{ secrets.TEST_SERVER_IP }}
          port: ${{ secrets.TEST_SERVER_PORT || 22 }}
          username: ${{ vars.TEST_DEPLOY_SSH_USER || 'root' }}
          key: ${{ secrets.SSH_PRIVATE_KEY_TESTING }}
          timeout: 60s
          command_timeout: 12m
          envs: LIVE_SMOKE_B64
          script: |
            set -eu
            if [ "$(docker inspect --format '{{.State.Running}}' ag-dashboard-backend 2>/dev/null)" != "true" ]; then
              echo "FATAL: ag-dashboard-backend is not running on the stage host" >&2
              exit 1
            fi
            printf '%s' "$LIVE_SMOKE_B64" | base64 -d | docker exec -i ag-dashboard-backend node -

  rag-eval:
    if: >-
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') &&
      (github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'rag-eval')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: rag_eval
          POSTGRES_PASSWORD: rag_eval
          POSTGRES_DB: rag_eval
        options: >-
          --health-cmd "pg_isready -U rag_eval -d rag_eval"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://rag_eval:rag_eval@localhost:5432/rag_eval
      NODE_ENV: test
      DB_SYNC_ON_BOOT: 'false'
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      AIHUBMIX_API_KEY: ${{ secrets.AIHUBMIX_API_KEY || vars.AIHUBMIX_API_KEY || secrets.AIHUBMIX_KEY || vars.AIHUBMIX_KEY || '' }}
      AI_PRIMARY_PROVIDER: ${{ secrets.AI_PRIMARY_PROVIDER || vars.AI_PRIMARY_PROVIDER || 'aihubmix' }}
      # Chat model: an eval-specific override, else the AI_PRIMARY_MODEL secret.
      # The AI_PRIMARY_MODEL repo variable is skipped: it held a retired model.
      # The fallback defaults to NVIDIA because CI has no Ollama server.
      AI_PRIMARY_MODEL: ${{ secrets.RAG_EVAL_PRIMARY_MODEL || vars.RAG_EVAL_PRIMARY_MODEL || secrets.AI_PRIMARY_MODEL || 'gemini-3.1-flash-lite' }}
      AI_FALLBACK_PROVIDER: ${{ secrets.RAG_EVAL_FALLBACK_PROVIDER || vars.RAG_EVAL_FALLBACK_PROVIDER || 'nvidia' }}
      AI_FALLBACK_MODEL: ${{ secrets.RAG_EVAL_FALLBACK_MODEL || vars.RAG_EVAL_FALLBACK_MODEL || 'nvidia/nemotron-3.5-lightning-30b-a3b' }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      AI_EMBEDDINGS_PROVIDER: ${{ secrets.AI_EMBEDDINGS_PROVIDER || vars.AI_EMBEDDINGS_PROVIDER || 'aihubmix' }}
      AI_EMBEDDINGS_MODEL: ${{ secrets.AI_EMBEDDINGS_MODEL || vars.AI_EMBEDDINGS_MODEL || 'text-embedding-3-large' }}
      # Same Azure settings as the deploys, for an azure_openai provider selection.
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT || vars.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_DEPLOYMENT_NAME: ${{ secrets.AZURE_OPENAI_DEPLOYMENT_NAME || vars.AZURE_OPENAI_DEPLOYMENT_NAME || 'gpt-4' }}
      RAG_RERANK_URL: ${{ secrets.RAG_RERANK_URL || vars.RAG_RERANK_URL || '' }}
      RAG_RERANK_MODEL: ${{ secrets.RAG_RERANK_MODEL || vars.RAG_RERANK_MODEL || 'jina-reranker-v2-base-multilingual' }}
      RAG_RERANK_API_KEY: ${{ secrets.RAG_RERANK_API_KEY || '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # After a deploy, evaluate the commit that was deployed.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install backend dependencies
        run: npm ci --workspace=ag-extension-dashboard/src/backend
      - name: Migrate a fresh pgvector database
        working-directory: ag-extension-dashboard/src/backend
        run: |
          PGPASSWORD=rag_eval psql -h localhost -U rag_eval -d rag_eval -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS vector;'
          npx --no-install prisma generate
          npx --no-install prisma migrate deploy
      - name: Evaluate retrieval against the golden set
        working-directory: ag-extension-dashboard/src/backend
        run: npm run eval:rag -- --gate --out=rag-eval-report.json
      - name: Keep the per-case report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rag-eval-report
          path: ag-extension-dashboard/src/backend/rag-eval-report.json
          if-no-files-found: ignore

  # Writes to the chosen site's database (the @real.agriext.test population),
  # so it only ever runs when dispatched by hand. See user-stories-live.yml.
  user-stories:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'user-stories'
    uses: ./.github/workflows/user-stories-live.yml
    with:
      target: ${{ inputs.target }}
    secrets: inherit
