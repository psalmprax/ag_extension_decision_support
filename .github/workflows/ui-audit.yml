name: UI menu audit (stage)

# Opens every left-menu page on the stage deployment as an admin, an extension
# officer and a farmer, and records what each page did: crashes, failed API
# calls, console errors, stuck loading, plan locks. Screenshots and the JSON
# report are committed to the ops/ui-audit-results branch.
#
# It creates three temporary accounts on the stage database
# (ui-audit-<role>@audit.invalid, random password masked in logs) and always
# removes them afterwards. The crawler only clicks sidebar items.

on:
  workflow_dispatch:
  push:
    branches: [ops/ui-audit]   # trial runs only; never merged

permissions:
  contents: write

concurrency:
  group: ui-audit
  cancel-in-progress: false

env:
  # The stage frontend is only bound to the server's localhost (and its public
  # domain has no DNS record), so the audit reaches it through an SSH tunnel.
  AUDIT_BASE_URL: http://localhost:7503
  AUDIT_ADMIN_EMAIL: ui-audit-admin@audit.invalid
  AUDIT_OFFICER_EMAIL: ui-audit-officer@audit.invalid
  AUDIT_FARMER_EMAIL: ui-audit-farmer@audit.invalid
  AUDIT_DEMO: 'true'   # also crawl the public demo session (no account needed)

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Tunnel to the stage frontend
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY_TESTING }}
          STAGE_HOST: ${{ secrets.TEST_SERVER_IP }}
          STAGE_PORT: ${{ secrets.TEST_SERVER_PORT || 22 }}
          STAGE_USER: ${{ vars.TEST_DEPLOY_SSH_USER || 'root' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/stage && chmod 600 ~/.ssh/stage
          ssh_stage() { ssh -i ~/.ssh/stage -p "$STAGE_PORT" -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 "$STAGE_USER@$STAGE_HOST" "$@"; }
          remote=$(ssh_stage "docker port ag-dashboard-frontend 80/tcp | head -1")
          echo "stage frontend is published on the host at $remote"
          ssh_stage -f -N -L "7503:$remote"
          for i in $(seq 1 10); do curl -fsS -o /dev/null --max-time 10 "$AUDIT_BASE_URL/login" && break; sleep 2; done
          curl -fsS --max-time 10 -o /dev/null -w 'stage frontend through the tunnel: HTTP %{http_code}\n' "$AUDIT_BASE_URL/login"
          curl -fsS --max-time 10 -w '\nstage API through the tunnel: HTTP %{http_code}\n' "$AUDIT_BASE_URL/api/health"

      - name: One-time password for the audit accounts
        run: |
          pw="$(openssl rand -base64 36 | tr -dc 'A-Za-z0-9' | head -c 28)Aa1!"
          echo "::add-mask::$pw"
          echo "AUDIT_PASSWORD=$pw" >> "$GITHUB_ENV"

      - name: Create the temporary audit accounts on stage
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.TEST_SERVER_IP }}
          port: ${{ secrets.TEST_SERVER_PORT || 22 }}
          username: ${{ vars.TEST_DEPLOY_SSH_USER || 'root' }}
          key: ${{ secrets.SSH_PRIVATE_KEY_TESTING }}
          command_timeout: 5m
          envs: AUDIT_PASSWORD,AUDIT_ADMIN_EMAIL,AUDIT_OFFICER_EMAIL,AUDIT_FARMER_EMAIL
          script: |
            set -eu
            hash=$(docker exec -e PW="$AUDIT_PASSWORD" ag-dashboard-backend node -e "process.stdout.write(require('bcryptjs').hashSync(process.env.PW, 10))")
            docker exec -i -e H="$hash" -e A="$AUDIT_ADMIN_EMAIL" -e O="$AUDIT_OFFICER_EMAIL" -e F="$AUDIT_FARMER_EMAIL" ag-dashboard-db \
              sh -c 'psql -v ON_ERROR_STOP=1 -q -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v hash="$H" -v a="$A" -v o="$O" -v f="$F"' <<'SQL'
            WITH t AS (SELECT tenant_id FROM farmers WHERE tenant_id IS NOT NULL GROUP BY tenant_id ORDER BY count(*) DESC LIMIT 1)
            INSERT INTO users (email, password_hash, first_name, last_name, role, is_active, email_verified, mfa_enabled, tenant_id)
            SELECT v.email, :'hash', 'Audit', v.last, v.role, true, true, false, (SELECT tenant_id FROM t)
            FROM (VALUES (:'a', 'Admin', 'admin'), (:'o', 'Officer', 'extension_officer'), (:'f', 'Farmer', 'farmer')) AS v(email, last, role)
            ON CONFLICT (email) DO UPDATE
              SET password_hash = EXCLUDED.password_hash, is_active = true, mfa_enabled = false,
                  failed_login_attempts = 0, lockout_until = NULL;
            INSERT INTO farmers (first_name, last_name, crops, user_id, tenant_id, region)
            SELECT 'Audit', 'Farmer', ARRAY['maize'], u.id, u.tenant_id, 'Machakos'
            FROM users u WHERE u.email = :'f' AND NOT EXISTS (SELECT 1 FROM farmers x WHERE x.user_id = u.id);
            SQL
            echo "audit accounts ready"

      - name: Install Playwright
        working-directory: ag-extension-dashboard/src/frontend
        run: |
          npm install --no-save --no-audit --no-fund --ignore-scripts @playwright/test@1.63.0
          npx playwright install --with-deps chromium

      - name: Audit every menu page
        working-directory: ag-extension-dashboard/src/frontend
        env:
          AUDIT_OUT: ${{ github.workspace }}/ui-audit
        run: npx playwright test -c playwright.live.config.ts

      - name: Remove the audit accounts
        if: always()
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.TEST_SERVER_IP }}
          port: ${{ secrets.TEST_SERVER_PORT || 22 }}
          username: ${{ vars.TEST_DEPLOY_SSH_USER || 'root' }}
          key: ${{ secrets.SSH_PRIVATE_KEY_TESTING }}
          command_timeout: 5m
          script: |
            set -eu
            docker exec -i ag-dashboard-db sh -c 'psql -v ON_ERROR_STOP=1 -q -U "$POSTGRES_USER" -d "$POSTGRES_DB"' <<'SQL'
            DO $$
            BEGIN
              DELETE FROM user_sessions WHERE user_id IN (SELECT id FROM users WHERE email LIKE 'ui-audit-%@audit.invalid');
              DELETE FROM farmers WHERE user_id IN (SELECT id FROM users WHERE email LIKE 'ui-audit-%@audit.invalid');
              DELETE FROM users WHERE email LIKE 'ui-audit-%@audit.invalid';
              RAISE NOTICE 'audit accounts deleted';
            EXCEPTION WHEN foreign_key_violation THEN
              UPDATE users SET is_active = false, password_hash = 'disabled-after-ui-audit'
              WHERE email LIKE 'ui-audit-%@audit.invalid';
              RAISE NOTICE 'audit accounts are referenced by other rows; deactivated and password removed instead';
            END $$;
            SELECT count(*) AS active_audit_accounts FROM users WHERE email LIKE 'ui-audit-%@audit.invalid' AND is_active;
            SQL

      - name: Publish the report to ops/ui-audit-results
        if: always()
        run: |
          [ -d ui-audit ] || { echo "no report produced"; exit 0; }
          cd ui-audit
          git init -q -b ops/ui-audit-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "UI menu audit of $AUDIT_BASE_URL at $(date -u +%FT%TZ), commit ${GITHUB_SHA::7}, run $GITHUB_RUN_ID" > README.md
          git add -A && git commit -qm "UI menu audit, run $GITHUB_RUN_ID"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ops/ui-audit-results
          echo "report published to ops/ui-audit-results"
