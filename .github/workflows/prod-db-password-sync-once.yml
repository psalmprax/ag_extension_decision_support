# One-off production repair (lives only on ops/prod-db-password-sync; never merged).
#
# The production .env's DATABASE_PASSWORD no longer matches the password the
# database role was created with, so the backend (recreated with the .env value)
# and `prisma migrate deploy` are rejected with P1000. This aligns the role's
# password to the .env value — the single source of truth every service reads —
# using the database container's local socket, which needs no old password.
# The password is read inside the container from its own environment
# (POSTGRES_PASSWORD, set from DATABASE_PASSWORD at creation); it never appears
# in this script or its logs.
name: Production DB password sync (one-off)
on:
  push:
    branches: [ops/prod-db-password-sync]
concurrency:
  group: prod-db-password-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Align the database role password with .env, migrate, restart, verify
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: ${{ vars.PROD_DEPLOY_SSH_USER || 'root' }}
          key: ${{ secrets.SSH_PRIVATE_KEY_PRODUCTION }}
          command_timeout: 10m
          script: |
            set -eu
            cd "${HOME:?}/ag_extension_decision_support/ag-extension-dashboard"
            COMPOSE_FILES="-f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.agents.yml"
            tcp_login() {
              docker exec ag-dashboard-db sh -c 'PGPASSWORD="$POSTGRES_PASSWORD" psql -h 127.0.0.1 -U "${POSTGRES_USER:-postgres}" -d "${POSTGRES_DB:-postgres}" -tAc "select 1"' >/dev/null 2>&1
            }

            echo "1/5 Database container carries a password"
            docker exec ag-dashboard-db sh -c 'test -n "${POSTGRES_PASSWORD:-}"' \
              || { echo "FATAL: ag-dashboard-db has no POSTGRES_PASSWORD"; exit 1; }

            echo "2/5 Check whether the .env password is accepted"
            if tcp_login; then
              echo "    already accepted; leaving the role unchanged"
            else
              echo "    rejected; setting the role password to the .env value via the local socket"
              docker exec -i ag-dashboard-db sh -c 'psql -v ON_ERROR_STOP=1 -q -U "${POSTGRES_USER:-postgres}" -d "${POSTGRES_DB:-postgres}" -v pw="$POSTGRES_PASSWORD"' <<'SQL'
            ALTER ROLE CURRENT_USER WITH PASSWORD :'pw';
            SQL
              tcp_login || { echo "FATAL: password still rejected after ALTER ROLE"; exit 1; }
              echo "    verified: password login now succeeds"
            fi

            echo "3/5 Apply pending migrations"
            docker compose $COMPOSE_FILES run --rm -e SKIP_MIGRATIONS=true backend npx prisma migrate deploy

            echo "4/5 Restart the backend so it reconnects"
            docker compose $COMPOSE_FILES up -d --no-deps backend
            docker compose $COMPOSE_FILES restart backend

            echo "5/5 Wait for /api/health"
            for i in $(seq 1 36); do
              if docker exec ag-dashboard-backend node -e "fetch('http://localhost:3001/api/health').then(async r=>{const t=await r.text();console.log('    HTTP',r.status,t.slice(0,400));process.exit(r.ok?0:1)}).catch(e=>{console.log('    not ready:',e.message);process.exit(1)})"; then
                echo "Backend healthy."
                exit 0
              fi
              sleep 5
            done
            echo "FATAL: backend not healthy after 3 minutes"
            docker compose $COMPOSE_FILES logs --tail=60 backend
            exit 1
