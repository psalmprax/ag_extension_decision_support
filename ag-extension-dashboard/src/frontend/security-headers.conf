# Security headers for every response from this server.
#
# nginx only inherits add_header from the server block when a location sets none of its
# own, so a location with its own add_header (cache rules) silently sent none of these.
# nginx.conf includes this file at server level and again in each such location.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# Content Security Policy
# NOTE: 'unsafe-eval' stays out of script-src. The edge ONNX runtime needs
# only the narrow 'wasm-unsafe-eval' directive to instantiate its
# self-hosted WASM binaries (/models/ort/) — full JS eval remains blocked.
# One line: a header value spanning lines is sent as obsolete line folding,
# which strict HTTP clients (Node, mobile HTTP libraries) reject outright.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://*.openstreetmap.org https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com https://*.openstreetmap.org; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.tile.openstreetmap.org https://server.arcgisonline.com https://*.tile.opentopomap.org https://images.unsplash.com https://*.ytimg.com https://unpkg.com; font-src 'self' data: https://unpkg.com; connect-src 'self' https://tile.openstreetmap.org https://*.tile.openstreetmap.org https://server.arcgisonline.com https://*.tile.opentopomap.org https://api.openai.com https://nominatim.openstreetmap.org https://power.larc.nasa.gov https://*.azure.com https://*.google.com wss: https://*.ingest.sentry.io https://*.ingest.us.sentry.io https://*.ingest.de.sentry.io; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'; worker-src 'self' blob:; script-src-elem 'self' 'unsafe-inline' https://*.openstreetmap.org https://unpkg.com; script-src-attr 'unsafe-inline';" always;
