server {
    listen 80;
    listen [::]:80;
    # Catch-all server name — accepts any domain/IP since Traefik routes to us
    server_name _;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Allow photo uploads, datasets, and media up to 50MB (prevents 413 on leaf/crop image analysis)
    client_max_body_size 50M;

    # Security headers (one list, also included in every location with its own add_header)
    include /etc/nginx/snippets/security-headers.conf;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/wasm image/svg+xml;
    gzip_proxied any;
    gzip_comp_level 6;

    # The service worker keeps its name between releases, so it is never cached as immutable:
    # browsers and proxies must ask for it again, or users keep an old one.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Cache static assets aggressively
    location ~* \.(?:css|js|woff2?|eot|ttf|otf|svg|png|jpg|jpeg|gif|ico|webp|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
    }

    # Runtime modules are build assets; keep them out of the model alias below.
    location ^~ /models/ort/ {
        types {
            application/wasm wasm;
            text/javascript mjs;
        }
        try_files $uri =404;
    }

    # Machine-learning models are served from a separate image path (not copied into
    # the dist image) so the multi-MB ONNX binary ships on demand, not in the SPA payload.
    # The classifier fetches it on first use and the service worker caches it (CacheFirst,
    # 'ml-models'); heuristic triage covers offline/dev when the file is absent.
    location /models/ {
        alias /usr/share/nginx/ml/;
        autoindex off;
    }

    # API proxy. `^~` keeps the static-asset regex above from capturing API
    # paths that end in an image extension (uploaded photos are served from
    # /api/v1/upload/file/<key>.jpg): without it nginx looked for them on disk
    # and answered 404, so chat photos never loaded behind this proxy.
    location ^~ /api/ {
        proxy_pass http://ag-dashboard-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
    }

    # Library imports: an NGO's recordings or a labelled photo set arrive as one zip,
    # larger than the 50 MB photo limit and slower to unpack. The backend caps them at
    # IMPORT_ARCHIVE_MAX_MB (300 MB by default). A longer prefix than /api/, so it wins.
    location ^~ /api/imports/ {
        client_max_body_size 300M;
        proxy_request_buffering off;
        proxy_pass http://ag-dashboard-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # Socket.IO WebSocket proxy
    location ^~ /socket.io/ {
        proxy_pass http://ag-dashboard-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Health endpoints - bypass SPA routing
    location /health {
        proxy_pass http://ag-dashboard-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # Static files - SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to sensitive files
    location ~ (\.env|\.git|composer\.json|package\.json|tsconfig\.) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }

    error_page 404 /index.html;
    location = /404.html {
        internal;
    }
}
