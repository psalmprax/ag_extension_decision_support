server {
    listen 80;
    listen [::]:80;
    # Catch-all server name — accepts any domain/IP since Traefik routes to us
    server_name _;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # ============================================================
    # Security Headers
    # ============================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Content Security Policy
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.openstreetmap.org https://unpkg.com;
        style-src 'self' 'unsafe-inline' https://unpkg.com https://*.openstreetmap.org;
        img-src 'self' data: blob: https://*.tile.openstreetmap.org https://images.unsplash.com https://*.ytimg.com https://unpkg.com;
        font-src 'self' data: https://unpkg.com;
        connect-src 'self' https://api.openai.com https://nominatim.openstreetmap.org https://power.larc.nasa.gov https://*.azure.com https://*.google.com wss:;
        frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com;
        media-src 'self';
        object-src 'none';
        base-uri 'self';
        form-action 'self';
        manifest-src 'self';
        worker-src 'self' blob:;
    " always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/wasm image/svg+xml;
    gzip_proxied any;
    gzip_comp_level 6;

    # Cache static assets aggressively
    location ~* \.(?:css|js|woff2?|eot|ttf|otf|svg|png|jpg|jpeg|gif|ico|webp|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # API proxy
    location /api/ {
        proxy_pass http://ag-dashboard-backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
    }

    # Health endpoint - bypass SPA routing
    location = /health {
        proxy_pass http://ag-dashboard-backend:3001/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    # Static files - SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to sensitive files
    location ~ (\.env|\.git|composer\.json|package\.json|tsconfig\.) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }

    error_page 404 /index.html;
    location = /404.html {
        internal;
    }
}
