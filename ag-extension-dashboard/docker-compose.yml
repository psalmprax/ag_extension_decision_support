# ============================================================
# Base Docker Compose — shared services for all environments
# ============================================================
# Usage:
#   Dev:  docker compose up -d
#   Prod: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#   +agents (any): docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.agents.yml up -d
#
# Profiles (optional):
#   COMPOSE_PROFILES=full   — starts backend + frontend (default when omitted)
#   COMPOSE_PROFILES=db     — starts only app-db + redis (no app services)
#   COMPOSE_PROFILES=infra  — starts infra only (app-db, redis, traefik)
# ============================================================

services:
  # ── Infrastructure ────────────────────────────────────────

  app-db:
    build:
      context: .
      dockerfile: Dockerfile.db
    container_name: ag-dashboard-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-ag_extension}
    ports:
      - "${DATABASE_PORT:-127.0.0.1:7501}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ag-network
    # Network ag-network used for intra-service communication (shared with prod)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:alpine
    container_name: ag-dashboard-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-agext_redis_2024} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-127.0.0.1:7502}:6379"
    volumes:
      - redis_data:/data
    networks:
      - ag-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-agext_redis_2024}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Reverse Proxy ─────────────────────────────────────────
  # Traefik auto-discovers services via Docker labels.
  # Dev: HTTP only on port 80.
  # Prod: add -f docker-compose.prod.yml for HTTPS + Let's Encrypt.
  traefik:
    image: traefik:v3.7
    container_name: ag-traefik
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedByDefault=false"
      - "--providers.docker.network=ag-network"
      - "--entrypoints.web.address=:80"
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - ag-network
    restart: unless-stopped

  # ── Application Services (dev default, prod override) ──────

  backend:
    build:
      context: ./src/backend
      target: ${BACKEND_DOCKER_TARGET:-development}
    container_name: ag-dashboard-backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${BACKEND_MEMORY_LIMIT:-1G}
          cpus: ${BACKEND_CPU_LIMIT:-1.0}
    ports:
      - "${BACKEND_PORT:-127.0.0.1:7500}:3001"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${DATABASE_USER:-postgres}:${DATABASE_PASSWORD:-postgres}@app-db:5432/${DATABASE_NAME:-ag_extension}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-agext_redis_2024}@redis:6379
      PORT: 3001
      NODE_ENV: ${NODE_ENV:-development}
      JWT_SECRET: ${JWT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      AI_PRIMARY_PROVIDER: ${AI_PRIMARY_PROVIDER:-openai}
      AI_PRIMARY_MODEL: ${AI_PRIMARY_MODEL:-gpt-4o}
      AI_EMBEDDINGS_PROVIDER: ${AI_EMBEDDINGS_PROVIDER:-openai}
      AI_EMBEDDINGS_MODEL: ${AI_EMBEDDINGS_MODEL:-text-embedding-3-large}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ettametta-ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      AI_FALLBACK_PROVIDER: ${AI_FALLBACK_PROVIDER:-ollama}
      DEMO_ENABLED: ${DEMO_ENABLED:-true}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo-trial-2024}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:7503}
      WEATHER_API_KEY: ${WEATHER_API_KEY:-}
    depends_on:
      app-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ag-network
      - ettametta_ettametta
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend-dev.rule=(Host(`${DOMAIN:-www.gpexts.com}`) || Host(`localhost`) || Host(`127.0.0.1`) || Host(`145.223.97.248`)) && (PathPrefix(`/api`) || PathPrefix(`/api-docs`) || PathPrefix(`/socket.io`) || PathPrefix(`/health`))"
      - "traefik.http.routers.backend-dev.entrypoints=web"
      - "traefik.http.routers.backend-dev.middlewares=redirect-to-https"
      - "traefik.http.services.backend.loadbalancer.server.port=3001"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"
      - "traefik.http.routers.backend-dev-secure.entrypoints=websecure"
      - "traefik.http.routers.backend-dev-secure.tls=true"
      - "traefik.http.routers.backend-dev-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.backend-dev-secure.tls.domains[0].main=www.gpexts.com"
      - "traefik.http.routers.backend-dev-secure.tls.domains[0].sans=*.gpexts.com"
      - "traefik.http.routers.backend-dev-secure.rule=(Host(`${DOMAIN:-www.gpexts.com}`) || Host(`localhost`) || Host(`127.0.0.1`) || Host(`145.223.97.248`)) && (PathPrefix(`/api`) || PathPrefix(`/api-docs`) || PathPrefix(`/socket.io`) || PathPrefix(`/health`))"

  frontend:
    build:
      context: ./src/frontend
      target: ${FRONTEND_DOCKER_TARGET:-development}
    container_name: ag-dashboard-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-127.0.0.1:7503}:5173"
    environment:
      - VITE_API_URL=${VITE_API_URL:-/api}
      - VITE_WS_URL=${VITE_WS_URL:-}
    depends_on:
      - backend
    networks:
      - ag-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend-dev.rule=Host(`${DOMAIN:-www.gpexts.com}`) || Host(`localhost`) || Host(`127.0.0.1`) || Host(`145.223.97.248`)"
      - "traefik.http.routers.frontend-dev.entrypoints=web"
      - "traefik.http.routers.frontend-dev.middlewares=redirect-to-https"
      - "traefik.http.routers.frontend-dev-secure.entrypoints=websecure"
      - "traefik.http.routers.frontend-dev-secure.tls=true"
      - "traefik.http.routers.frontend-dev-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.frontend-dev-secure.tls.domains[0].main=www.gpexts.com"
      - "traefik.http.routers.frontend-dev-secure.tls.domains[0].sans=*.gpexts.com"
      - "traefik.http.routers.frontend-dev-secure.rule=Host(`${DOMAIN:-www.gpexts.com}`) || Host(`localhost`) || Host(`127.0.0.1`) || Host(`145.223.97.248`)"

  # ── Local AI (optional) ───────────────────────────────────
  # Disabled by default; enable with COMPOSE_PROFILES=ai
  # or include docker-compose.agents.yml
  ettametta-ollama:
    image: ollama/ollama:0.6.2
    container_name: ettametta-ollama
    profiles:
      - ai
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
    ports:
      - "127.0.0.1:11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_KEEP_ALIVE=5m
    entrypoint: /bin/sh -c "ollama serve & sleep 10 && ollama pull llama3.2:3b && wait"
    restart: unless-stopped
    networks:
      - ag-network
      - ettametta_ettametta

volumes:
  postgres_data:
  redis_data:
  ollama_data:

networks:
  ag-network:
    name: ag-network
    driver: bridge
  ettametta_ettametta:
    name: ettametta_ettametta
    driver: bridge