# ============================================================
# Base Docker Compose — shared services for all environments
# ============================================================
# Usage:
#   Dev:  docker compose up -d
#   Prod: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#   +agents (any): docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.agents.yml up -d
#
# Profiles (optional):
#   COMPOSE_PROFILES=full   — starts backend + frontend (default when omitted)
#   COMPOSE_PROFILES=db     — starts only app-db + redis (no app services)
#   COMPOSE_PROFILES=infra  — starts infra only (app-db, redis, traefik)
# ============================================================

services:
  # ── Infrastructure ────────────────────────────────────────

  app-db:
    build:
      context: .
      dockerfile: Dockerfile.db
    container_name: ag-dashboard-db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-ag_extension}
    # Loopback-only bind. NOTE: the host side MUST carry an explicit
    # `127.0.0.1:` prefix — a bare `DATABASE_PORT=7501` in .env would bind
    # Postgres to 0.0.0.0 and bypass Traefik entirely. DATABASE_BIND_IP lets a
    # deliberate remote-bind override (e.g. a bastion host), default loopback.
    ports:
      - "${DATABASE_BIND_IP:-127.0.0.1}:${DATABASE_PORT:-7501}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ag-network
    # Network ag-network used for intra-service communication (shared with prod)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:alpine
    container_name: ag-dashboard-redis
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # Container env for the healthcheck below: $$ defers expansion to runtime
    # inside the container, so the password never appears in healthcheck args.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-agext_redis_2024}
    # Cache instance: LRU eviction is fine here. NOT used by BullMQ — see redis-queue.
    command: redis-server --requirepass ${REDIS_PASSWORD:-agext_redis_2024} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_BIND_IP:-127.0.0.1}:${REDIS_PORT:-7502}:6379"
    volumes:
      - redis_data:/data
    networks:
      - ag-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Dedicated Redis for BullMQ queues (scheduled SMS/emails/notifications).
  # noeviction: under memory pressure writes fail loudly instead of silently
  # evicting pending jobs — LRU on queue data means lost scheduled messages.
  # appendonly: AOF with fsync everysec bounds job loss to ~1s on crash, vs the
  # RDB default which can lose the entire snapshot window of scheduled sends.
  redis-queue:
    image: redis:alpine
    container_name: ag-dashboard-redis-queue
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # Container env for the healthcheck below: $$ defers expansion to runtime
    # inside the container, so the password never appears in healthcheck args.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-agext_redis_2024}
    command: redis-server --requirepass ${REDIS_PASSWORD:-agext_redis_2024} --maxmemory 256mb --maxmemory-policy noeviction --appendonly yes --appendfsync everysec
    ports:
      - "${REDIS_QUEUE_BIND_IP:-127.0.0.1}:${REDIS_QUEUE_PORT:-7503}:6379"
    volumes:
      - redis_queue_data:/data
    networks:
      - ag-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Docker Socket Proxy ─────────────────────────────────────
  # Least-privilege gateway in front of /var/run/docker.sock. Traefik only needs to
  # LIST containers/networks to auto-discover backends; a direct socket mount would
  # give a compromised Traefik root-equivalent access to the host (create containers,
  # mount the filesystem, reach other services). This proxy exposes read-only
  # discovery endpoints only — no container exec, start/stop, image, volume, or
  # swarm APIs.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: ag-docker-socket-proxy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      CONTAINERS: 1   # GET /containers/* — Traefik service discovery
      NETWORKS: 1     # GET /networks/*
      VERSION: 1      # GET /version
      POST: 0         # no mutating requests
      # Everything else defaults to 0 (denied): exec, images, volumes, swarm.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - ag-network
    tmpfs:
      - /tmp

  # ── Reverse Proxy ─────────────────────────────────────────
  # Traefik auto-discovers services via Docker labels — through the read-only
  # socket proxy above, never the raw docker.sock.
  # Dev: HTTP only on port 80.
  # Prod: add -f docker-compose.prod.yml for HTTPS + Let's Encrypt.
  traefik:
    image: traefik:v3.7
    container_name: ag-traefik
    depends_on:
      - docker-socket-proxy
    command:
      - "--providers.docker=true"
      - "--providers.docker.endpoint=tcp://docker-socket-proxy:2375"
      - "--providers.docker.exposedByDefault=false"
      - "--providers.docker.network=ag-network"
      - "--entrypoints.web.address=:80"
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
    volumes: []
    networks:
      - ag-network
    restart: unless-stopped

  # ── Application Services (dev default, prod override) ──────

  backend:
    # Image pin: BACKEND_IMAGE_ID (written by deploy-all.yml after the bake) pins
    # the service to the exact immutable image ID built for this deploy, so a
    # concurrent retag of :latest can't change what runs. Falls back to the
    # mutable tag for plain `docker compose up --build` dev flows.
    image: ${BACKEND_IMAGE_ID:-ag-extension-dashboard-backend:latest}
    security_opt:
      - no-new-privileges:true
    build:
      # Monorepo root so the shared API contract (ag-extension-shared) is in scope.
      context: ..
      dockerfile: ag-extension-dashboard/src/backend/Dockerfile
      target: ${BACKEND_DOCKER_TARGET:-development}
    container_name: ag-dashboard-backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${BACKEND_MEMORY_LIMIT:-1G}
          cpus: ${BACKEND_CPU_LIMIT:-1.0}
    ports:
      - "${BACKEND_BIND_IP:-127.0.0.1}:${BACKEND_PORT:-7500}:3001"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${DATABASE_USER:-postgres}:${DATABASE_PASSWORD:-postgres}@app-db:5432/${DATABASE_NAME:-ag_extension}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-agext_redis_2024}@redis:6379
      # BullMQ goes to the dedicated noeviction instance, never the LRU cache
      QUEUE_REDIS_URL: redis://:${REDIS_PASSWORD:-agext_redis_2024}@redis-queue:6379
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_DEPLOYMENT_NAME: ${AZURE_OPENAI_DEPLOYMENT_NAME:-gpt-4}
      GOOGLE_VERTEX_PROJECT_ID: ${GOOGLE_VERTEX_PROJECT_ID:-}
      AIHUBMIX_API_KEY: ${AIHUBMIX_API_KEY:-}
      AIHUBMIX_ACCESS_KEY: ${AIHUBMIX_ACCESS_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      FREEBUFF_AUTH_TOKEN: ${FREEBUFF_AUTH_TOKEN:-}
      WEATHER_API_KEY: ${WEATHER_API_KEY:-}
      WEATHER_API_URL: ${WEATHER_API_URL:-https://api.weatherapi.com/v1}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_EMAIL: ${VAPID_EMAIL:-mailto:admin@gpexts.com}
      AI_PRIMARY_PROVIDER: ${AI_PRIMARY_PROVIDER:-aihubmix}
      AI_PRIMARY_MODEL: ${AI_PRIMARY_MODEL:-gemini-2.5-flash}
      AIHUBMIX_WEB_SEARCH: ${AIHUBMIX_WEB_SEARCH:-true}
      AI_EMBEDDINGS_PROVIDER: ${AI_EMBEDDINGS_PROVIDER:-openai}
      AI_EMBEDDINGS_MODEL: ${AI_EMBEDDINGS_MODEL:-text-embedding-3-large}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ettametta-ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      AI_FALLBACK_PROVIDER: ${AI_FALLBACK_PROVIDER:-ollama}
      AI_FALLBACK_MODEL: ${AI_FALLBACK_MODEL:-llama3.2:3b}
      ADVISORY_ENGINE_ENABLED: ${ADVISORY_ENGINE_ENABLED:-true}
      # Requires the agents stack (docker-compose.agents.yml) — off unless explicitly enabled.
      INGESTION_ENABLED: ${INGESTION_ENABLED:-false}
      AGENT_ZERO_URL: ${AGENT_ZERO_URL:-http://ag-agent-zero:8000}
      CREW_AI_URL: ${CREW_AI_URL:-http://ag-crew-ai:8001}
      MCP_API_TOKEN: ${MCP_API_TOKEN:-}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      CLAMD_HOST: ${CLAMD_HOST:-clamav}
      CLAMD_FAIL_OPEN: ${CLAMD_FAIL_OPEN:-true}
      UPLOAD_QUOTA_MB: ${UPLOAD_QUOTA_MB:-500}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-false}
      PILLARS_SPEC_ROUTES_ENABLED: ${PILLARS_SPEC_ROUTES_ENABLED:-false}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      MPESA_ENV: ${MPESA_ENV:-sandbox}
      MPESA_CONSUMER_KEY: ${MPESA_CONSUMER_KEY:-}
      MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET:-}
      MPESA_SHORTCODE: ${MPESA_SHORTCODE:-}
      MPESA_PASSKEY: ${MPESA_PASSKEY:-}
      MPESA_CALLBACK_SECRET: ${MPESA_CALLBACK_SECRET:-}
      MPESA_KES_PER_USD: ${MPESA_KES_PER_USD:-}
      # Demo login is opt-in everywhere now — no environment gets it by
      # default. (The base compose used to default DEMO_ENABLED=true with a
      # publicly-known fallback password, granting a free extension_officer
      # account on any `docker compose up` that forgot to set the vars.)
      DEMO_ENABLED: ${DEMO_ENABLED:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:7503}
    depends_on:
      app-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ag-network
      - ettametta_ettametta
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend-dev.rule=(Host(`${DOMAIN:-www.gpexts.com}`) || Host(`localhost`) || Host(`127.0.0.1`)) && (PathPrefix(`/api`) || PathPrefix(`/api-docs`) || PathPrefix(`/socket.io`) || PathPrefix(`/health`))"
      - "traefik.http.routers.backend-dev.entrypoints=web"
      - "traefik.http.routers.backend-dev.middlewares=https-redirect"
      - "traefik.http.services.backend.loadbalancer.server.port=3001"
      - "traefik.http.services.backend.loadbalancer.responsetimeout=300s"
      - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.https-redirect.redirectscheme.permanent=true"
      - "traefik.http.routers.backend-dev-secure.entrypoints=websecure"
      - "traefik.http.routers.backend-dev-secure.tls=true"
      - "traefik.http.routers.backend-dev-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.backend-dev-secure.tls.domains[0].main=www.gpexts.com"
      - "traefik.http.routers.backend-dev-secure.tls.domains[0].sans=gpexts.com"
      - "traefik.http.routers.backend-dev-secure.rule=(Host(`${DOMAIN:-www.gpexts.com}`) || Host(`localhost`) || Host(`127.0.0.1`)) && (PathPrefix(`/api`) || PathPrefix(`/api-docs`) || PathPrefix(`/socket.io`) || PathPrefix(`/health`))"

  frontend:
    image: ${FRONTEND_IMAGE_ID:-ag-extension-dashboard-frontend:latest}
    build:
      context: ..
      dockerfile: ag-extension-dashboard/src/frontend/Dockerfile
      target: ${FRONTEND_DOCKER_TARGET:-development}
    container_name: ag-dashboard-frontend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "${FRONTEND_BIND_IP:-127.0.0.1}:${FRONTEND_PORT:-7503}:5173"
    environment:
      - VITE_API_URL=${VITE_API_URL:-/api}
      - VITE_WS_URL=${VITE_WS_URL:-}
    depends_on:
      - backend
    networks:
      - ag-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend-dev.rule=Host(`${DOMAIN:-www.gpexts.com}`) || Host(`localhost`) || Host(`127.0.0.1`)"
      - "traefik.http.routers.frontend-dev.entrypoints=web"
      - "traefik.http.routers.frontend-dev.middlewares=https-redirect"
      - "traefik.http.routers.frontend-dev-secure.entrypoints=websecure"
      - "traefik.http.routers.frontend-dev-secure.tls=true"
      - "traefik.http.routers.frontend-dev-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.frontend-dev-secure.tls.domains[0].main=www.gpexts.com"
      - "traefik.http.routers.frontend-dev-secure.tls.domains[0].sans=gpexts.com"
      - "traefik.http.routers.frontend-dev-secure.rule=Host(`${DOMAIN:-www.gpexts.com}`) || Host(`localhost`) || Host(`127.0.0.1`)"

  # ── Local AI (optional) ───────────────────────────────────
  # Disabled by default; enable with COMPOSE_PROFILES=ai
  # or include docker-compose.agents.yml
  ettametta-ollama:
    image: ollama/ollama:0.6.2
    # Pin DNS so the entrypoint's `ollama pull llama3.2:3b` can resolve
    # `registry.ollama.ai`. Docker's embedded DNS at 127.0.0.11 does not
    # always reach the host's upstream resolvers from inside the container's
    # network namespace (i/o timeout on UDP 127.0.0.1:NNN -> 127.0.0.11:53).
    # Bypassing it makes cold-pull deterministic on hosts filtering egress
    # UDP/53 from the bridge subnet. OLLAMA_DNS env-var lets dev hosts behind
    # corporate firewalls override (e.g. OLLAMA_DNS=10.0.0.53).
    dns:
      - ${OLLAMA_DNS:-1.1.1.1}
      - 8.8.8.8
    profiles:
      - ai
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
    ports:
      - "127.0.0.1:11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_KEEP_ALIVE=5m
    restart: unless-stopped
    networks:
      - ag-network
      - ettametta_ettametta

  # ClamAV daemon for upload scanning. Backend uses it when CLAMD_HOST=clamav.
  # ~1GB RAM for signatures; disable with `docker compose up --scale clamav=0` on tiny hosts.
  clamav:
    image: clamav/clamav:stable
    container_name: ag-dashboard-clamav
    restart: unless-stopped
    environment:
      CLAMAV_NO_FRESHCLAMD: "false"
    volumes:
      - clamav_db:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1 || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 300s
    networks:
      - ag-network

  # Scheduled logical backups of the app DB (pg_dump → gzip → retention prune).
  # Off-host copy is still the operator's job: mount ./backups or sync the volume.
  db-backup:
    image: postgres:16-alpine
    container_name: ag-dashboard-db-backup
    restart: unless-stopped
    depends_on:
      app-db:
        condition: service_healthy
    environment:
      PGHOST: app-db
      PGUSER: ${DATABASE_USER:-postgres}
      PGPASSWORD: ${DATABASE_PASSWORD:-postgres}
      PGDATABASE: ${DATABASE_NAME:-ag_extension}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - ./scripts/db-backup-sidecar.sh:/usr/local/bin/db-backup-sidecar.sh:ro
      - db_backups:/backups
    entrypoint: ["/bin/sh", "/usr/local/bin/db-backup-sidecar.sh"]
    networks:
      - ag-network

volumes:
  postgres_data:
  redis_data:
  redis_queue_data:
  ollama_data:
  db_backups:
  clamav_db:

networks:
  ag-network:
    name: ag-network
    external: true
  ettametta_ettametta:
    name: ettametta_ettametta
    external: true