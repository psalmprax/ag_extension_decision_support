services:
  app-db:
    build:
      context: .
      dockerfile: Dockerfile.db
    container_name: ag-dashboard-db
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-ag_extension}
    ports:
      - "7501:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ag-network

  redis:
    image: redis:alpine
    container_name: ag-dashboard-redis
    restart: always
    ports:
      - "7502:6379"
    volumes:
      - redis_data:/data
    networks:
      - ag-network

  backend:
    build:
      context: ./src/backend
      target: development
    container_name: ag-dashboard-backend
    restart: always
    ports:
      - "7500:3001"
    environment:
      - DATABASE_URL=postgresql://${DATABASE_USER:-postgres}:${DATABASE_PASSWORD:-postgres}@app-db:5432/${DATABASE_NAME:-ag_extension}?schema=public
      - REDIS_URL=redis://redis:6379
      - PORT=3001
      - NODE_ENV=development
      - JWT_SECRET=${JWT_SECRET:-dev-secret-key-for-local-only}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AI_PRIMARY_PROVIDER=${AI_PRIMARY_PROVIDER:-openai}
      - AI_PRIMARY_MODEL=${AI_PRIMARY_MODEL:-gpt-4o}
      - AI_EMBEDDINGS_PROVIDER=${AI_EMBEDDINGS_PROVIDER:-openai}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://ettametta-ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
      - AI_FALLBACK_PROVIDER=${AI_FALLBACK_PROVIDER:-ollama}
    depends_on:
      - app-db
      - redis
    # volumes:
    #   - ./src/backend:/app
    #   - /app/node_modules
    networks:
      - ag-network
      - ettametta_ettametta

  frontend:
    build:
      context: ./src/frontend
      target: development
    container_name: ag-dashboard-frontend
    ports:
      - "7503:5173"
    environment:
      - VITE_API_URL=/api
    depends_on:
      - backend
    # volumes:
    #   - ./src/frontend:/app
    #   - /app/node_modules
    networks:
      - ag-network

  ettametta-ollama:
    image: ollama/ollama:latest
    container_name: ettametta-ollama
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_KEEP_ALIVE=5m
    entrypoint: /bin/sh -c "ollama serve & sleep 10 && ollama pull llama3.2:3b && wait"
    restart: unless-stopped
    networks:
      - ag-network
      - ettametta_ettametta

volumes:
  postgres_data:
  redis_data:
  ollama_data:

networks:
  ag-network:
    name: ag-network
    external: true
  ettametta_ettametta:
    name: ettametta_ettametta
    external: true
