# ============================================================
# Production Override — HTTPS + Let's Encrypt + Nginx
# ============================================================
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#   With agents:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.agents.yml up -d --build
#
# Required .env vars:
#   ACME_EMAIL=admin@gpexts.com     (Let's Encrypt registration email)
#   DOMAIN=www.gpexts.com           (primary production domain)
#
# Architecture:
#   www.gpexts.com:443 ─→ Traefik ─→ frontend:80 (Nginx SPA)
#   gpexts.com:443     ─→         ─→ backend:3001 (API)
#   HTTP :80            ─→         ─→ HTTPS :443 (redirect)
#
# Note: Let's Encrypt cert covers www.gpexts.com + gpexts.com via SAN.
# ============================================================
#
# IMPORTANT: Docker Compose v5 replaces (not merges) the `labels:` list
# from the base compose file. ALL required labels must be included here.
# ============================================================

services:
  traefik:
    image: traefik:v3.7
    command:
      # Docker provider — auto-discovers labeled services
      - "--providers.docker=true"
      - "--providers.docker.exposedByDefault=false"
      - "--providers.docker.network=ag-network"
      # HTTP → HTTPS redirect entrypoint
      - "--entrypoints.web.address=:80"
      # HTTPS entrypoint with Let's Encrypt
      - "--entrypoints.websecure.address=:443"
      # Let's Encrypt TLS challenge + certificate resolver
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    networks:
      - ag-network
    restart: always

  backend:
    build:
      context: ./src/backend
      target: production
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-warn}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://www.gpexts.com}
      DEMO_ENABLED: true
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Demo@123}
    labels:
      # Enable Traefik service discovery
      - "traefik.enable=true"
      # Load-balancer port (Nginx/Traefik forwards to this)
      - "traefik.http.services.backend.loadbalancer.server.port=3001"
      # Router 1 — HTTP → HTTPS redirect (primary domain)
      - "traefik.http.routers.backend-redirect.rule=(Host(`${DOMAIN:-www.gpexts.com}`) || Host(`gpexts.com`)) && (PathPrefix(`/api`) || PathPrefix(`/api-docs`) || PathPrefix(`/socket.io`) || PathPrefix(`/health`))"
      - "traefik.http.routers.backend-redirect.entrypoints=web"
      - "traefik.http.routers.backend-redirect.middlewares=https-redirect"
      # Router 2 — HTTPS + TLS (primary domain)
      - "traefik.http.routers.backend.rule=(Host(`${DOMAIN:-www.gpexts.com}`) || Host(`gpexts.com`)) && (PathPrefix(`/api`) || PathPrefix(`/api-docs`) || PathPrefix(`/socket.io`) || PathPrefix(`/health`))"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls=true"
      - "traefik.http.routers.backend.tls.domains[0].main=www.gpexts.com"
      - "traefik.http.routers.backend.tls.domains[0].sans=gpexts.com"
      # Router 3 — localhost/IP for health checks (HTTP only, no TLS)
      - "traefik.http.routers.backend-local.rule=(Host(`localhost`) || Host(`127.0.0.1`) || Host(`145.223.97.248`) || Host(`149.104.110.122`)) && (PathPrefix(`/api`) || PathPrefix(`/api-docs`) || PathPrefix(`/socket.io`) || PathPrefix(`/health`))"
      - "traefik.http.routers.backend-local.entrypoints=web"
      # HTTP → HTTPS redirect middleware (per-service scope)
      - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"

  frontend:
    build:
      context: ./src/frontend
      target: production
    # No environment overrides — uses nginx with static asset serving
    labels:
      # Enable Traefik service discovery
      - "traefik.enable=true"
      # Nginx serves on port 80 inside container
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
      # Router 1 — HTTP → HTTPS redirect (primary domain)
      - "traefik.http.routers.frontend-redirect.rule=Host(`${DOMAIN:-www.gpexts.com}`) || Host(`gpexts.com`)"
      - "traefik.http.routers.frontend-redirect.entrypoints=web"
      - "traefik.http.routers.frontend-redirect.middlewares=https-redirect"
      # Router 2 — HTTPS + TLS (primary domain)
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN:-www.gpexts.com}`) || Host(`gpexts.com`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.routers.frontend.tls.domains[0].main=www.gpexts.com"
      - "traefik.http.routers.frontend.tls.domains[0].sans=gpexts.com"
      # Router 3 — localhost/IP for local dev testing (HTTP only)
      - "traefik.http.routers.frontend-local.rule=Host(`localhost`) || Host(`127.0.0.1`) || Host(`145.223.97.248`) || Host(`149.104.110.122`)"
      - "traefik.http.routers.frontend-local.entrypoints=web"
      # HTTP → HTTPS redirect middleware
      - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"

volumes:
  traefik_letsencrypt:
    driver: local