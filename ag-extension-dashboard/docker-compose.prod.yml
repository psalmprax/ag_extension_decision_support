# ============================================================
# Production Override — HTTPS + Let's Encrypt + Nginx Frontend
# ============================================================
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     -f docker-compose.agents.yml up -d --build
#
# Ensure these are set in .env:
#   ACME_EMAIL=admin@gpexts.com     (required for Let's Encrypt)
#   DOMAIN=www.gpexts.com           (your production domain)
#
# Architecture:
#   www.gpexts.com:443 ─→ Traefik ─→ frontend:80 (Nginx, SPA)
#                        ─→ Traefik ─→ backend:3001 (API)
#   HTTP :80 redirects to HTTPS :443
# ============================================================

services:
  traefik:
    command:
      # Docker provider
      - "--providers.docker=true"
      - "--providers.docker.exposedByDefault=false"
      - "--providers.docker.network=ag-network"
      # HTTP entrypoint (no global redirect — handled by router-level redirect)
      - "--entrypoints.web.address=:80"
      # HTTPS entrypoint with Let's Encrypt
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    networks:
      - ag-network
    restart: always

  backend:
    labels:
      # Router 1: API domain on HTTP → HTTPS redirect
      - "traefik.http.routers.backend-redirect.rule=(Host(`${DOMAIN:-www.gpexts.com}`)) && (PathPrefix(`/api`) || PathPrefix(`/api-docs`) || PathPrefix(`/socket.io`) || PathPrefix(`/health`))"
      - "traefik.http.routers.backend-redirect.entrypoints=web"
      - "traefik.http.routers.backend-redirect.middlewares=https-redirect"
      # Router 2: API domain on HTTPS + Let's Encrypt TLS
      - "traefik.http.routers.backend.rule=(Host(`${DOMAIN:-www.gpexts.com}`)) && (PathPrefix(`/api`) || PathPrefix(`/api-docs`) || PathPrefix(`/socket.io`) || PathPrefix(`/health`))"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      # Router 3: localhost/IP on HTTP only (for health checks / debugging)
      - "traefik.http.routers.backend-local.rule=(Host(`localhost`) || Host(`145.223.97.248`)) && (PathPrefix(`/api`) || PathPrefix(`/api-docs`) || PathPrefix(`/socket.io`) || PathPrefix(`/health`))"
      - "traefik.http.routers.backend-local.entrypoints=web"
      # HTTP→HTTPS redirect middleware
      - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"

  frontend:
    build:
      context: ./src/frontend
      target: production
    labels:
      # Router 1: domain on HTTP → HTTPS redirect
      - "traefik.http.routers.frontend-redirect.rule=Host(`${DOMAIN:-www.gpexts.com}`)"
      - "traefik.http.routers.frontend-redirect.entrypoints=web"
      - "traefik.http.routers.frontend-redirect.middlewares=https-redirect"
      # Router 2: domain on HTTPS + Let's Encrypt TLS
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN:-www.gpexts.com}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      # Router 3: localhost/IP on HTTP only (for health checks / debugging)
      - "traefik.http.routers.frontend-local.rule=Host(`localhost`) || Host(`145.223.97.248`)"
      - "traefik.http.routers.frontend-local.entrypoints=web"
      # HTTP→HTTPS redirect middleware
      - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"

volumes:
  traefik_letsencrypt:
