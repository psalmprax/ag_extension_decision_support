# ============================================================
# Development Override
# ============================================================
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# What this enables:
#   • Vite hot-module-replacement (frontend rebuilds on source change)
#   • ts-node-dev auto-restarts (backend recompiles on TS change)
#   • Bind-mounted source dirs (no rebuild needed for most changes)
#   • Debug ports open (backend:9229, frontend:9228)
#   • Verbose logging (LOG_LEVEL=debug)
#   • Traefik dev ports: 80 (HTTP), 8080 (HTTP dev), 8443 (HTTPS dev, self-signed)
# ============================================================

services:
  backend:
    build:
      context: ./src/backend
      target: development
    # Bind-mount source for hot-reload (changes reflect without rebuild)
    volumes:
      - ./src/backend/src:/app/src:rw
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      DEBUG_PORT: 9229
      DEMO_ENABLED: "true"
      DEMO_PASSWORD: demo-trial-2024
      AI_PRIMARY_PROVIDER: ollama
      AI_PRIMARY_MODEL: llama3.2:1b
      AI_FALLBACK_PROVIDER: openai
      OLLAMA_MODEL: llama3.2:1b
    # Expose debug port on all interfaces (local only)
    ports:
      - "127.0.0.1:9229:9229"
    command: ["node", "--inspect=0.0.0.0:9229", "node_modules/.bin/ts-node-dev", "--respawn", "--transpile-only", "-r", "tsconfig-paths/register", "src/index.ts"]
    # Include all base labels + dev-specific webdev/webdev-secure routers
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend-dev.rule=(Host(`${DOMAIN:-www.gpexts.com}`) || Host(`localhost`) || Host(`127.0.0.1`) || Host(`145.223.97.248`)) && (PathPrefix(`/api`) || PathPrefix(`/api-docs`) || PathPrefix(`/socket.io`) || PathPrefix(`/health`))"
      - "traefik.http.routers.backend-dev.entrypoints=web"
      - "traefik.http.routers.backend-dev.middlewares=https-redirect"
      - "traefik.http.services.backend.loadbalancer.server.port=3001"
      - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.https-redirect.redirectscheme.permanent=true"
      - "traefik.http.routers.backend-dev-secure.entrypoints=websecure"
      - "traefik.http.routers.backend-dev-secure.tls=true"
      - "traefik.http.routers.backend-dev-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.backend-dev-secure.tls.domains[0].main=www.gpexts.com"
      - "traefik.http.routers.backend-dev-secure.tls.domains[0].sans=gpexts.com"
      - "traefik.http.routers.backend-dev-secure.rule=(Host(`${DOMAIN:-www.gpexts.com}`) || Host(`localhost`) || Host(`127.0.0.1`) || Host(`145.223.97.248`)) && (PathPrefix(`/api`) || PathPrefix(`/api-docs`) || PathPrefix(`/socket.io`) || PathPrefix(`/health`))"
      # Dev HTTP entrypoint (port 8080)
      - "traefik.http.routers.backend-dev-webdev.rule=(Host(`localhost`) || Host(`127.0.0.1`) || Host(`161.97.126.84`)) && (PathPrefix(`/api`) || PathPrefix(`/api-docs`) || PathPrefix(`/socket.io`) || PathPrefix(`/health`))"
      - "traefik.http.routers.backend-dev-webdev.entrypoints=webdev"
      # Dev HTTPS entrypoint (port 8443, self-signed cert)
      - "traefik.http.routers.backend-dev-webdev-secure.rule=(Host(`localhost`) || Host(`127.0.0.1`) || Host(`161.97.126.84`)) && (PathPrefix(`/api`) || PathPrefix(`/api-docs`) || PathPrefix(`/socket.io`) || PathPrefix(`/health`))"
      - "traefik.http.routers.backend-dev-webdev-secure.entrypoints=webdev-secure"
      - "traefik.http.routers.backend-dev-webdev-secure.tls=true"

  frontend:
    build:
      context: ./src/frontend
      target: development
    # Bind-mount source for hot-reload
    volumes:
      - ./src/frontend/src:/app/src:rw
      - ./src/frontend/public:/app/public:rw
    environment:
      VITE_API_URL: http://localhost:7500/api
      VITE_WS_URL: ws://localhost:7500
    ports:
      - "127.0.0.1:5173:5173"
      - "127.0.0.1:9228:9228"
    # Include all base labels + dev-specific webdev/webdev-secure routers
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend-dev.rule=Host(`${DOMAIN:-www.gpexts.com}`) || Host(`localhost`) || Host(`127.0.0.1`) || Host(`145.223.97.248`)"
      - "traefik.http.routers.frontend-dev.entrypoints=web"
      - "traefik.http.routers.frontend-dev.middlewares=https-redirect"
      - "traefik.http.routers.frontend-dev-secure.entrypoints=websecure"
      - "traefik.http.routers.frontend-dev-secure.tls=true"
      - "traefik.http.routers.frontend-dev-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.frontend-dev-secure.tls.domains[0].main=www.gpexts.com"
      - "traefik.http.routers.frontend-dev-secure.tls.domains[0].sans=gpexts.com"
      - "traefik.http.routers.frontend-dev-secure.rule=Host(`${DOMAIN:-www.gpexts.com}`) || Host(`localhost`) || Host(`127.0.0.1`) || Host(`145.223.97.248`)"
      # Dev HTTP entrypoint (port 8080)
      - "traefik.http.routers.frontend-dev-webdev.rule=Host(`localhost`) || Host(`127.0.0.1`) || Host(`161.97.126.84`)"
      - "traefik.http.routers.frontend-dev-webdev.entrypoints=webdev"
      # Dev HTTPS entrypoint (port 8443, self-signed cert)
      - "traefik.http.routers.frontend-dev-webdev-secure.rule=Host(`localhost`) || Host(`127.0.0.1`) || Host(`161.97.126.84`)"
      - "traefik.http.routers.frontend-dev-webdev-secure.entrypoints=webdev-secure"
      - "traefik.http.routers.frontend-dev-webdev-secure.tls=true"

  traefik:
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedByDefault=false"
      - "--providers.docker.network=ag-network"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.webdev.address=:8080"
      - "--entrypoints.webdev-secure.address=:8443"
      - "--accesslog=true"
      - "--log.level=DEBUG"
    ports:
      - "80:80"
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8443:8443"