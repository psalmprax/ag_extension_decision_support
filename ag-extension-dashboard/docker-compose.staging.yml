# ============================================================
# Staging Override — HTTPS + Let's Encrypt + Demo + Ollama
# ============================================================
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d --build
#   With agents:
#   docker compose -f docker-compose.yml -f docker-compose.staging.yml -f docker-compose.agents.yml up -d --build
#
# Required .env vars:
#   ACME_EMAIL=admin@gpexts.com         (Let's Encrypt registration email)
#   STAGING_DOMAIN=staging.gpexts.com   (primary staging domain)
#
# Architecture:
#   staging.gpexts.com:443 ─→ Traefik ─→ frontend:80 (Nginx SPA)
#   staging.gpexts.com:443 ─→         ─→ backend:3001 (API)
#   HTTP :80                 ─→         ─→ HTTPS :443 (redirect)
#
# Staging-specific overrides:
#   - Demo login enabled (DEMO_ENABLED=true)
#   - Ollama as primary AI provider with llama3.2:1b (fits 8G memory limit)
#   - Fallback to OpenAI for production-grade inference
#
# Note: Let's Encrypt cert covers staging.gpexts.com via SAN.
# ============================================================
#
# IMPORTANT: Docker Compose v5 replaces (not merges) the `labels:` list
# from the base compose file. ALL required labels must be included here.
# ============================================================

services:
  traefik:
    image: traefik:v3.7
    command:
      # Docker provider — auto-discovers labeled services
      - "--providers.docker=true"
      - "--providers.docker.exposedByDefault=false"
      - "--providers.docker.network=ag-network"
      # HTTP → HTTPS redirect entrypoint
      - "--entrypoints.web.address=:80"
      # HTTPS entrypoint with Let's Encrypt
      - "--entrypoints.websecure.address=:443"
      # Let's Encrypt TLS challenge + certificate resolver
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    networks:
      - ag-network
    restart: always

  backend:
    build:
      context: ./src/backend
      target: production
    env_file:
      - .env
    environment:
      NODE_ENV: staging
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Staging uses its own domain for CORS
      CORS_ORIGIN: ${CORS_ORIGIN:-https://${STAGING_DOMAIN:-staging.gpexts.com}}
      # Demo login (overrides .env DEMO_ENABLED=false)
      DEMO_ENABLED: "true"
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo-trial-2024}
      # AI providers — Ollama primary on staging server, OpenAI fallback
      AI_PRIMARY_PROVIDER: ${AI_PRIMARY_PROVIDER:-ollama}
      AI_PRIMARY_MODEL: ${AI_PRIMARY_MODEL:-llama3.2:1b}
      AI_EMBEDDINGS_PROVIDER: ${AI_EMBEDDINGS_PROVIDER:-ollama}
      AI_EMBEDDINGS_MODEL: ${AI_EMBEDDINGS_MODEL:-nomic-embed-text}
      AI_FALLBACK_PROVIDER: ${AI_FALLBACK_PROVIDER:-openai}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
      OLLAMA_REQUEST_TIMEOUT_MS: ${OLLAMA_REQUEST_TIMEOUT_MS:-300000}
    labels:
      # Enable Traefik service discovery
      - "traefik.enable=true"
      # Load-balancer port
      - "traefik.http.services.backend.loadbalancer.server.port=3001"
      # Router 1 — HTTP → HTTPS redirect (staging domain)
      - "traefik.http.routers.backend-redirect.rule=(Host(`${STAGING_DOMAIN:-staging.gpexts.com}`)) && (PathPrefix(`/api`) || PathPrefix(`/api-docs`) || PathPrefix(`/socket.io`) || PathPrefix(`/health`))"
      - "traefik.http.routers.backend-redirect.entrypoints=web"
      - "traefik.http.routers.backend-redirect.middlewares=https-redirect"
      # Router 2 — HTTPS + TLS (staging domain)
      - "traefik.http.routers.backend.rule=(Host(`${STAGING_DOMAIN:-staging.gpexts.com}`)) && (PathPrefix(`/api`) || PathPrefix(`/api-docs`) || PathPrefix(`/socket.io`) || PathPrefix(`/health`))"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.backend.tls.domains[0].main=${STAGING_DOMAIN:-staging.gpexts.com}"
      # Router 3 — localhost/IP for local health checks (HTTP only, no TLS)
      - "traefik.http.routers.backend-local.rule=(Host(`localhost`) || Host(`127.0.0.1`) || Host(`145.223.97.248`)) && (PathPrefix(`/api`) || PathPrefix(`/api-docs`) || PathPrefix(`/socket.io`) || PathPrefix(`/health`))"
      - "traefik.http.routers.backend-local.entrypoints=web"
      # HTTP → HTTPS redirect middleware (per-service scope)
      - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"

  frontend:
    build:
      context: ..
      dockerfile: ag-extension-dashboard/src/frontend/Dockerfile
      target: production
    labels:
      # Enable Traefik service discovery
      - "traefik.enable=true"
      # Nginx serves on port 80 inside container
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
      # Router 1 — HTTP → HTTPS redirect (staging domain)
      - "traefik.http.routers.frontend-redirect.rule=Host(`${STAGING_DOMAIN:-staging.gpexts.com}`)"
      - "traefik.http.routers.frontend-redirect.entrypoints=web"
      - "traefik.http.routers.frontend-redirect.middlewares=https-redirect"
      # Router 2 — HTTPS + TLS (staging domain)
      - "traefik.http.routers.frontend.rule=Host(`${STAGING_DOMAIN:-staging.gpexts.com}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.frontend.tls.domains[0].main=${STAGING_DOMAIN:-staging.gpexts.com}"
      # Router 3 — localhost/IP for local dev testing (HTTP only)
      - "traefik.http.routers.frontend-local.rule=Host(`localhost`) || Host(`127.0.0.1`) || Host(`145.223.97.248`)"
      - "traefik.http.routers.frontend-local.entrypoints=web"
      # HTTP → HTTPS redirect middleware
      - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"

  # ── Ollama (staging override — smaller model, more memory) ─────────────
  # Base compose uses 4G + llama3.2:3b; staging server has limited RAM
  # so we use 8G + llama3.2:1b for reliable cold-start pulls.
  # nomic-embed-text is also pulled for fast CPU-based embeddings.
  ettametta-ollama:
    deploy:
      resources:
        limits:
          memory: 8G
    environment:
      OLLAMA_KEEP_ALIVE: 30m
    entrypoint: /bin/sh -c "ollama serve & sleep 10 && ollama pull llama3.2:1b && ollama pull nomic-embed-text && wait"

volumes:
  traefik_letsencrypt:
    driver: local